const ordSw = o => ordStatus(o) !== "Open" ? ORD_SW[ordStatus(o)] : { overdue:"red", due:"yellow", scheduled:"teal" }[o.band];
const issuedOf = o => o.issued || new Date((o.due || o.paid).getTime() - 14 * 864e5);
function remHist(o){
  const r = (o.rem || [[o.band === "scheduled" ? "Invoice issued with automatic payment on" : "Invoice emailed to " + ME.email, issuedOf(o)]]).slice();
  if (o.band === "paid") r.push(["Receipt emailed to " + ME.email, o.paid]);
  if (o.band === "refunded") r.push(["Refund issued to " + o.card, o.paid]);
  return r.sort((a, b) => b[1] - a[1]);
}
const payCardTop = o => '<div class="top"><div class="ic-c sw-' + ordSw(o) + '" style="--bg:color-mix(in srgb, var(--sw) 28%, #fff);--fg:var(--swt)">' + ic(o.band === "refunded" ? "refund" : "currency") + '</div><div class="tx"><b>' + esc(o.what) + "</b><span>" + esc(o.ctx) + '</span></div><div class="tr"><span class="amt" style="font-size:17px;font-weight:700">' + money(o.amt) + "</span>" + (ordStatus(o) === "Open" ? "" : pill(ordStatus(o), ordSw(o))) + "</div></div>";
const qSoon = q => daysFrom(q.valid) <= 7;
const qPill = q => qSoon(q) ? pill("Expiring Soon", "yellow") : pill("Open", "teal");
/* payment dates for invoices that charge automatically: Upcoming shows the date, never the amount */
const autoPay = () => data("payments").filter(o => o.band === "scheduled").map(o => ({ id:"x" + o.id, title:o.what, at:o.due, allDay:true, place:"Charges " + o.card + " automatically", status:"Automatic", pay:true, inv:o.id, for:o.entry, note:"Nothing to do. The amount is on the invoice." }));
/* saved cards: expiry from MM/YY, and what each one pays for automatically */
const cardName = c => c.brand + " ending " + c.last4;
const cardLabel = c => c.brand + " " + c.last4;
const cardEnd = c => { const p = c.exp.split("/").map(Number); return new Date(2000 + p[1], p[0], 0); };
const cardState = c => { const d = daysFrom(cardEnd(c)); return d < 0 ? "expired" : d <= 60 ? "soon" : "ok"; };
const cardPill = c => ({ expired:pill("Expired", "red"), soon:pill("Expiring Soon", "yellow"), ok:"" })[cardState(c)];
function usedBy(c){
  const l = cardLabel(c);
  return data("subscriptions").filter(u => u.card === l && u.auto).map(u => ({ w:"subscriptions", id:u.id, t:u.name, s:u.cadence + " subscription" + (u.state === "Paused" ? ", paused" : "") }))
    .concat(data("payments").filter(o => o.band === "scheduled" && o.card === l).map(o => ({ w:"payments", id:o.id, t:o.what, s:"Automatic payment on " + fDate(o.due) })));
}
function cardNote(c){
  const u = usedBy(c).length, e = cardEnd(c), end = MON[e.getMonth()] + " " + e.getFullYear();
  if (cardState(c) === "expired") return "Expired at the end of " + end + ". Nothing can be charged to it" + (u ? ", so " + plural(u, "automatic payment") + " will fail until you move " + (u === 1 ? "it" : "them") + " to another card." : ".");
  if (cardState(c) === "soon") return "Expires at the end of " + end + "." + (u ? " Update it before then, or " + plural(u, "automatic payment") + " will fail." : "");
  return "Valid through " + end + ".";
}
/* messages: one conversation per submission, plus the organization's announcements */
const slug = s => s.replace(/[^A-Za-z0-9]+/g, "-");
const avatar = n => n.ann ? '<div class="av-c ann">' + ic("info") + "</div>" : '<div class="av-c" style="--c:' + n.c + '">' + n.fi + "</div>";
const preview = n => n.body.slice(n.body.length > 1 ? 1 : 0).join(" ");
function threads(){
  const by = {};
  data("notifications").filter(n => !n.ann).forEach(n => { (by[n.entry] = by[n.entry] || []).push(n); });
  const th = Object.keys(by).map(e => { const msgs = by[e].slice().sort((a, b) => a.at - b.at), last = msgs[msgs.length - 1]; return { id:"m-" + slug(e), entry:e, msgs, last, at:last.at, fresh:msgs.filter(m => m.fresh).length, att:msgs.filter(m => m.att).length }; });
  const an = data("notifications").filter(n => n.ann).map(n => ({ id:n.id, ann:true, entry:"", msgs:[n], last:n, at:n.at, fresh:n.fresh ? 1 : 0, att:n.att ? 1 : 0, aud:n.aud || "All members" }));
  return th.concat(an).sort((a, b) => b.at - a.at);
}
/* what has happened on a submission since it was sent */
function activity(s){
  const mine = x => (x.entry === s.title || x.entry === s.form) && x.at >= s.at;
  const r = [[s.status === "Incomplete" ? "Saved for later" : "Submitted", s.at]];
  if (["Approved","Confirmed","Completed","Waitlisted","Received"].indexOf(s.status) >= 0) r.push(["Status changed to " + s.status, new Date(Math.min(s.at.getTime() + 864e5, NOW.getTime()))]);
  data("notifications").filter(mine).forEach(n => r.push(["Email sent: " + n.subj, n.at]));
  data("documents").filter(mine).forEach(d => r.push(["Document added: " + d.name, d.at]));
  data("payments").filter(o => (o.entry === s.title || o.entry === s.form) && o.paid && o.paid >= s.at).forEach(o => r.push([(o.band === "refunded" ? "Refunded: " : "Payment received: ") + o.what, o.paid]));
  return r.sort((a, b) => b[1] - a[1]);
}
const taskDue = () => data("tasks").map(t => ({ id:t.id, title:t.title, at:t.due, allDay:true, place:"Task from " + t.from, status:"Due", task:true, for:t.form, note:t.note }));
function visibleForms(){
  const subs = data("submissions");
  return FORMS.map(f => ({ id:f.name, name:f.name, start:!!f.start, vs:f.views.filter(v => !(v.auto && S.on.submissions)).map(v => ({ id:v.id, name:v.name, n:subs.filter(v.match).length })).filter(v => v.n > 0) }))
    .filter(f => f.vs.length || f.start);
}

function revs(d){
  if (d.revs) return d.revs;
  const r = [["Revision 1 · created from the " + d.entry + " entry", d.at]];
  if (d.state === "Signed") r.unshift(["Revision 2 · signed by you", d.at]);
  return r;
}

const inScope = s => S.subF !== "mine" || !s.by;
function scopeCtl(){

  return '<div class="scope" role="group" aria-label="Show entries">' + [["all", "All", all.length], ["mine", "My Submissions", mine]].map(o => '<button data-act="scope" data-v="' + o[0] + '" aria-pressed="' + ((S.subF || "all") === o[0]) + '">' + o[1] + " <em>" + o[2] + "</em></button>").join("") + "</div>";
}
const toPay = () => data("payments").filter(o => o.band === "overdue" || o.band === "due");
const paidYear = () => data("payments").filter(o => o.band === "paid" && o.paid.getFullYear() === TODAY.getFullYear()).reduce((a, o) => a + o.amt, 0);
const dateTile = (d, cls) => '<div class="dt-tile ' + (cls || "") + '"><i>' + MON[d.getMonth()] + "</i><b>" + d.getDate() + "</b></div>";
const fileIc = (ext) => '<div class="fi">' + (ICONS["file-" + (ext || "pdf")] || "") + "</div>";

/* ---------- widget bodies from Guest Portal Widget Explorations ---------- */
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const dkey = d => d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const relDay = d => { const n = daysFrom(d); return n === 0 ? "today" : n === 1 ? "tomorrow" : n > 1 ? "in " + n + " days" : n === -1 ? "yesterday" : -n + " days ago"; };
const TONE_SW = { need:"yellow", pay:"teal", ok:"green", late:"red" };
/* Upcoming can be drawn four ways; Month is where every portal starts (the two-week Calendar style was dropped) */
const EV_STYLES = [["month", "Month"], ["week", "Week"], ["list", "List"], ["cards", "Cards"]];
const evStyle = () => EV_STYLES.some(s => s[0] === S.views.events) ? S.views.events : "month";
const evTone = e => e.pay ? "pay" : (e.task || e.status === "RSVP" || e.status === "To Confirm") ? "need" : "ok";

  if (e.task){ const t = data("tasks").find(x => x.id === e.id); return '<span class="btn solid sm" data-act="task" data-id="' + e.id + '">' + esc(t ? t.verb : "Open") + "</span>"; }
  if (e.status === "RSVP") return '<span class="btn solid sm" data-act="rsvp" data-id="' + e.id + '">RSVP</span>';

function evRow(e, o){

  const lead = o.day ? '<span class="tm2"><b>' + DOW[e.at.getDay()] + " " + fDate(e.at) + "</b><span>" + tm + "</span></span>" : '<span class="tm">' + tm + "</span>";

function upcomingBody(items, style){
  const byDay = k => items.filter(e => dkey(e.at) === k);
  const dots = k => '<span class="x-dots">' + byDay(k).slice(0, 3).map(e => '<i class="sw-' + TONE_SW[evTone(e)] + '"></i>').join("") + "</span>";
  const legend = '<div class="x-legend">' + [["need", "Needs you"], ["pay", "Autopay"], ["ok", "Confirmed"]].map(l => '<span><i class="sw-' + TONE_SW[l[0]] + '"></i>' + l[1] + "</span>").join("") + "</div>";
  const nav = (label, unit) => '<div class="x-cal-h"><button class="x-nav" data-act="evnav" data-d="-1" aria-label="Previous ' + unit + '">' + ic("chevron-right", "flip") + '</button><span class="x-rng" aria-live="polite">' + label + '</span><button class="x-nav" data-act="evnav" data-d="1" aria-label="Next ' + unit + '">' + ic("chevron-right") + "</button></div>";
  const dow = '<div class="x-dow" aria-hidden="true">' + DOW.map(d => "<span>" + d + "</span>").join("") + "</div>";
  const cell = (d, sel, o) => {
    o = o || {}; const k = dkey(d), n = byDay(k).length, t = daysFrom(d);
    return '<button class="x-day' + (t === 0 ? " today" : t < 0 ? " past" : "") + (o.out ? " out" : "") + '" data-act="evsel" data-k="' + k + '" aria-pressed="' + (sel === k) + '" aria-label="' + fDay(d) + (n ? ", " + plural(n, "item") : "") + (t === 0 ? ", today" : "") + '">'
      + (o.dw ? '<span class="dw">' + DOW[d.getDay()] + "</span>" : "") + "<b>" + d.getDate() + "</b>" + dots(k) + "</button>";
  };
  const off = S.evOff || 0;
  const firstWith = days => { const ks = days.map(dkey); return ks.find((k, i) => daysFrom(days[i]) >= 0 && byDay(k).length) || ks.find(k => byDay(k).length) || null; };
  if (style === "list"){
    const groups = [];
    items.slice(0, 4).forEach(e => { const k = dkey(e.at); let g = groups.find(x => x.k === k); if (!g){ g = { k, d:e.at, its:[] }; groups.push(g); } g.its.push(e); });

    const sel = S.evSel && keys.includes(S.evSel) ? S.evSel : null, sd = sel ? days[keys.indexOf(sel)] : null;
    const groups = (sd ? [sd] : days).map(d => ({ d, its:byDay(dkey(d)) })).filter(g => g.its.length), n = groups.reduce((a, g) => a + g.its.length, 0);
    const need = groups.reduce((a, g) => a + g.its.filter(e => evTone(e) === "need").length, 0);

      + (sd ? '<button class="lk" data-act="evweek">Show whole week</button>' : "") + "</div>"
      + (groups.length ? groups.map(g => (sd ? "" : '<div class="x-dh sub"><b>' + fDay(g.d) + "</b><span>" + relDay(g.d) + "</span></div>") + g.its.map(e => evRow(e)).join("")).join("") : '<p class="x-empty">Nothing scheduled ' + (sd ? "this day." : "this week.") + "</p>") + "</div>";
  }
  /* month: six weeks around this month, with everything coming up listed beneath */
    const m0 = new Date(TODAY.getFullYear(), TODAY.getMonth() + off, 1), start = addDays(m0, -m0.getDay());

    return nav(MONTHS[m0.getMonth()] + " " + m0.getFullYear(), "month") + dow

      + '<div class="x-list scroll" tabindex="0" role="region" aria-label="Everything coming up">' + items.map(e => evRow(e, { day:true, sel:dkey(e.at) === sel })).join("") + "</div>" + legend;
}

function saveCard(){
  const k = S.card; if (!k || k.busy) return;
  const v = id => (document.getElementById(id) || {}).value || "";
  const num = v("cNum").replace(/\D/g, ""), exp = v("cExp").replace(/\s/g, ""), err = {};
  if (!v("cName").trim()) err.cName = "Name on card is required.";

  if (!exp) err.cExp = "Expiration is required."; else if (!/^(0[1-9]|1[0-2])\/?\d{2}$/.test(exp)) err.cExp = "Expiration must be formatted as MM/YY.";
  if (!v("cCvc").trim()) err.cCvc = "Security code is required.";
  if (!v("cZip").trim()) err.cZip = "ZIP code is required.";

  if (Object.keys(err).length){ render(); const b = document.querySelector(".cdlg .bad .inp"); if (b) b.focus(); return; }

    else {

function capSegs(root){
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for (let n; (n = tw.nextNode());){
    if (n.nodeValue.indexOf("·") < 0 || n.parentNode.nodeName === "TEXTAREA") continue;
    n.nodeValue = n.nodeValue.replace(/(·\s+)([a-z])(?=[^\s@]*(\s|$))/g, (m, a, c) => a + c.toUpperCase());
  }
}
function render(keepFocus){
  const fid = keepFocus && document.activeElement && document.activeElement.id;

  const tr0 = $("#frame .car-track"), sl = tr0 ? tr0.scrollLeft : 0;
  frame.innerHTML = portalHtml();

  const tr1 = $("#frame .car-track"); if (tr1 && sl) tr1.scrollLeft = sl;
  watchLayout();

  if (fid){ const el = document.getElementById(fid); if (el){ el.focus(); try { el.setSelectionRange(pos, pos); } catch(e){} } }
  renderPoc();

}

function toast(m){ const t = { m }; S.toasts.push(t); render(); setTimeout(() => { S.toasts = S.toasts.filter(x => x !== t); render(); }, 2800); }
function go(view, w, id, up){ S.backTo = up ? null : (S.view === "list" ? S.w : null); S.im = null; S.view = view; S.w = w || S.w; S.id = id || null; S.menu = null; if (view === "list" && w){ S.q = ""; S.filter = "all"; S.sort = ""; S.formF = "all"; S.dateF = "all"; } render(); const fr = $("#frame"); if (fr.getBoundingClientRect().top < 0) fr.scrollIntoView({ block:"start" }); }

document.addEventListener("click", e => {
  if (e.target.classList && e.target.classList.contains("dlg-scrim")) return act(S.card ? "cardclose" : S.dlg ? "dlgclose" : "imclose", {});
  const el = e.target.closest("[data-act],[data-go],[data-open],[data-filter],[data-attn],[data-view]");
  if (!el || !el.closest("#frame")){ if (S.menu && !e.target.closest(".menu")){ S.menu = null; render(); } return; }
  e.preventDefault();
  if (el.dataset.go){ S.ret = null; go("list", el.dataset.go); return; }
  if (el.dataset.view){ S.vid = el.dataset.view; go("view"); return; }
  if (el.dataset.open){
    const [w, id] = el.dataset.open.split(":");
    if (w === "events" && id[0] === "t") return act("task", { id });
    if (S.im || DRILL_VIEWS.indexOf(S.view) >= 0) return openItem(w, id);
    S.ret = S.view === "view" ? S.vid : null;
    go("detail", w, id); return;
  }
  if (el.dataset.filter){ S.filter = el.dataset.filter; render(); return; }
  if (el.dataset.attn != null){
    const a = attention()[+el.dataset.attn];
    if (a.act) return act(a.act[0], { id:a.act[1] });
    if (a.toast) return toast(a.toast);
    if (a.go[1] && S.view === "attn") return openItem(a.go[0], a.go[1]);
    return a.go[1] ? go("detail", a.go[0], a.go[1]) : go("list", a.go[0]);
  }
  act(el.dataset.act, el.dataset);
});

document.addEventListener("click", e => {

function act(a, ds){
  const id = ds.id;
  switch (a){
    case "home": return go("home", null, null, true);
    case "attnall": return go("attn");
    case "attntoggle": S.attnOpen = !S.attnOpen; return render();
    case "carnav": { const tr = $("#frame .car-track"), c = tr && carInfo(tr); return c && carTo(carPage(tr, c) + (+ds.dir)); }
    case "cardot": return carTo(+ds.i);
    case "profile": return go("profile");
    case "back": if (S.ret){ S.vid = S.ret; S.ret = null; return go("view"); } return go("list", S.w);
    case "up": return S.backTo && W[S.backTo] ? go("list", S.backTo, null, true) : go("home", null, null, true);
    case "scope": S.subF = ds.v; return render();
    /* Upcoming: pick a day, page the calendar, or go back to the whole week; focus stays on the control that was used */
    case "evsel": { const k = ds.k; S.evSel = evStyle() === "week" && S.evSel === k ? null : k; render(); const f = $('#frame [data-act="evsel"][data-k="' + k + '"]'); if (f) f.focus({ preventScroll:true }); return; }
    case "evnav": { S.evOff = (S.evOff || 0) + (+ds.d); S.evSel = null; render(); const f = $('#frame [data-act="evnav"][data-d="' + ds.d + '"]'); if (f) f.focus({ preventScroll:true }); return; }
    case "evweek": S.evSel = null; return render();
    case "billtab": S.billTab = ds.v; return render();
    case "acct": S.menu = S.menu === "acct" ? null : "acct"; return render();
    case "bell": S.menu = S.menu === "bell" ? null : "bell"; return render();
    case "filt": S.menu = S.menu === "filt" ? null : "filt"; return render();
    case "newmenu": S.menu = S.menu === "new-" + ds.where ? null : "new-" + ds.where; return render();
    case "start": S.form = ds.form; S.draftOf = null; S.taskOf = null; return openDlg();
    case "continue": { const s = D.submissions.find(x => x.id === id); S.form = s.form; S.draftOf = id; S.taskOf = null; return openDlg(); }
    case "task": { const t = D.tasks.find(x => x.id === id); if (!t) return; S.form = t.form; S.taskOf = id; S.draftOf = null; return openDlg(); }
    case "submit": case "savedraft": {
      if (S.taskOf){ const t = D.tasks.find(x => x.id === S.taskOf); D.tasks = D.tasks.filter(x => x !== t); S.taskOf = null; S.dlg = false; return toast(t.title + " completed."); }
      const f = S.form; saveForm(collect(), a === "submit"); S.dlg = false;
      return toast(f + (a === "submit" ? " submitted." : " saved for later."));
    }
    /* closing with answers typed saves them as a draft that shows up in Needs Your Attention; a task keeps its answers */
    case "dlgclose": {
      if (!S.dlg) return;
      const f = S.form, vals = collect(), dirty = S.dirty;
      S.dlg = false; S.dirty = false;
      if (!dirty){ S.taskOf = null; S.draftOf = null; return render(); }
      if (S.taskOf){ const t = D.tasks.find(x => x.id === S.taskOf); S.taskOf = null; if (t) t.vals = vals; return toast("Your answers are kept. " + (t ? t.title : "The task") + " is still in Needs Attention."); }
      saveForm(vals, false);
      return toast(f + " saved for later. Finish it from Needs Attention.");
    }
    case "go": S.ret = null; return go("list", ds.w);
    case "inv": if (S.im) return openItem("payments", id); return go("detail", "payments", id);
    case "imclose": S.im = null; S.confirm = null; return render();
    case "imback": S.im.pop(); S.confirm = null; if (!S.im.length) S.im = null; return render();
    case "entry": { const s = D.submissions.find(x => x.title === ds.name || x.form === ds.name); return s ? (S.im ? openItem("submissions", s.id) : go("detail", "submissions", s.id)) : toast("Opens " + ds.name + "."); }
    case "rsvp": { const ev = D.events.find(x => x.id === id); ev.status = "Going"; return toast("RSVP sent for " + ev.title + "."); }
    case "confirm": { const ev = D.events.find(x => x.id === id); ev.status = "Confirmed"; return toast(ev.title + " confirmed."); }
    case "cal": return toast("Downloads a calendar file you can open in any calendar app.");
    case "sign": { const d = D.documents.find(x => x.id === id); toast("Opens the signing ceremony. Simulated: " + d.name + " signed."); d.state = d.signed + 1 >= d.need ? "Signed" : "To Sign"; d.signed++; (d.parties || []).forEach(p => { if (p[1] === "Waiting for you") p[1] = "Signed " + fDate(TODAY); }); if (d.revs) d.revs.unshift(["Revision " + (d.revs.length + 1) + " · signed by you", new Date()]); const s = D.submissions.find(x => x.title === d.entry || x.form === d.entry); if (s && s.status === "Awaiting Signature") s.status = "Submitted"; return render(); }
    case "payone": { const o = D.payments.find(x => x.id === id); o.band = "paid"; o.paid = new Date(TODAY); o.card = o.card || "Visa 4242"; delete o.status; D.submissions.filter(s => s.status === "Unpaid" && s.title === o.entry).forEach(s => s.status = "Completed"); return toast("Opens checkout for " + money(o.amt) + ". Simulated: paid."); }
    case "pause": { const u = D.subscriptions.find(x => x.id === id); if (u.state === "Active"){ u.state = "Paused"; u.resume = fDate(day(60)); u._next = u.next; u.next = null; } else { u.state = "Active"; u.next = u._next || day(30); } return toast(u.name + (u.state === "Paused" ? " paused." : " resumed.")); }
    case "plan": { const u = D.subscriptions.find(x => x.id === id), p = u.plans[+ds.i]; u.amt = p[2]; u.cadence = p[1]; u.per = p[3]; return toast("Plan changed to " + p[0] + ", " + money(p[2]) + " " + p[1].toLowerCase() + ". Simulated."); }
    case "pref": S.prefs[ds.k] = !S.prefs[ds.k]; return render();
    case "addcard": return openCard({ mode:"add" });
    case "cardupd": return openCard({ mode:"update", id });
    case "cardsub": return openCard({ mode:"pick", t:"sub", id });
    case "cardinv": return openCard({ mode:"pick", t:"inv", id });
    case "cardnew": S.card = { mode:S.card.t, id:S.card.id }; render(); { const f = document.getElementById("cNum"); if (f) f.focus({ preventScroll:true }); } return;
    case "cardpick": { const k = S.card, c = D.cards.find(x => x.id === id), tg = pickTarget(k); tg.card = cardLabel(c); S.card = null; return toast((k.t === "inv" ? tg.num : tg.name) + " now uses " + cardName(c) + "."); }
    case "cardclose": S.card = null; return render();
    case "cardsave": return saveCard();
    case "mkdefault": { const c = D.cards.find(x => x.id === id); D.cards.forEach(x => { x.def = x === c; }); return toast("Default card changed to " + cardName(c) + "."); }
    case "rmask": S.confirm = id; return render();
    case "rmcancel": S.confirm = null; return render();
    case "rmcard": { const c = D.cards.find(x => x.id === id); D.cards = D.cards.filter(x => x !== c); S.confirm = null; go("list", "cards"); return toast(cardName(c) + " removed."); }
    case "download": return toast("Downloads the PDF.");
    case "toast": return toast(ds.msg);
  }
}

  const g = e.target.closest(".grip"); if (!g || e.button !== 0) return;
  e.preventDefault();

  row.classList.add("drag");

    const before = others.find(x => { const b = x.getBoundingClientRect(); return mid < b.top + b.height / 2; });
    const prevTop = row.getBoundingClientRect().top;

      base += row.getBoundingClientRect().top - prevTop;

  if (x.dtab) S.dtab = x.dtab;
  Object.keys(x.titles || {}).forEach(k => { if (W[k] && x.titles[k] && !(k === "submissions" && x.titles[k] === "My Submissions")) W[k].title = x.titles[k]; });
  loadPortal(PORTALS.some(p => p.id === x.portal) ? x.portal : S.portal, true);
}
function saveSettings(){ try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(snapshot())); } catch (e) {} }
function resetSettings(){
  try { localStorage.removeItem(SETTINGS_KEY); } catch (e) {}
  const d = clone(DEFAULTS); d.portal = S.portal; applySettings(d);
  renderDrawer(); toast("Settings reset to default.");
}
/* a ?fresh link is for testing: it forgets this browser's saved setup and the dismissed tip, so each load starts like a new respondent */
if (new URLSearchParams(location.search).has("fresh")) try { localStorage.removeItem(SETTINGS_KEY); localStorage.removeItem("guestPortalSetupStudy.introDismissed"); } catch (e) {}
try { applySettings(JSON.parse(localStorage.getItem(SETTINGS_KEY) || "null")); } catch (e) {}

renderDrawer();
render();

/* on first visit, a tip under Settings explains the task; dismissing it (or opening Settings) keeps it closed in this browser */
const INTRO_KEY = "guestPortalSetupStudy.introDismissed";
function placeIntro(){
  const el = $("#intro"); if (!el) return;
  const b = $("#brandBtn").getBoundingClientRect(), w = el.offsetWidth;
  const left = Math.max(16, Math.min(b.left + b.width / 2 - w / 2, window.innerWidth - w - 16));
  el.style.top = (b.bottom + 12) + "px"; el.style.left = left + "px";
  el.style.setProperty("--ax", (b.left + b.width / 2 - left) + "px");
}
function closeIntro(){
  const el = $("#intro"); if (!el) return;
  el.remove(); try { localStorage.setItem(INTRO_KEY, "1"); } catch (e) {}
}
function openIntro(){
  let seen = false; try { seen = localStorage.getItem(INTRO_KEY) === "1"; } catch (e) {}
  if (seen) return;
  const el = document.createElement("div");
  el.className = "intro"; el.id = "intro"; el.setAttribute("role", "dialog"); el.setAttribute("aria-labelledby", "introT");
  el.innerHTML = '<b id="introT">Set Up This Portal Your Way</b><p>Use Customize Portal to configure the portal how you’d want it for your guests. When you’re done, click Submit &amp; Begin Survey to complete a short follow-up survey.</p>'
    + '<button class="ok" type="button">Got It</button><button class="x" type="button" aria-label="Dismiss">' + ic("ex") + "</button>";
  el.addEventListener("click", e => { if (e.target.closest(".x, .ok")) closeIntro(); });
  document.body.appendChild(el); placeIntro();
}
window.addEventListener("resize", placeIntro);
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#intro") && !$("#sdone")) closeIntro(); });
openIntro();
</script>
