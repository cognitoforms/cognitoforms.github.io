<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Guest Portal Setup Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Arvo:wght@400;700&family=Berkshire+Swash&family=Dancing+Script:wght@400;700&family=Handlee&family=Limelight&family=Lobster&family=Lora:wght@400;700&family=Montserrat:wght@400;700&family=Neuton:wght@400;700&family=Open+Sans:wght@400;600;700&family=Oswald:wght@400;700&family=Princess+Sofia&family=Raleway:wght@400;700&family=Roboto+Condensed:wght@400;700&family=Roboto+Slab:wght@400;700&family=Shadows+Into+Light+Two&family=Ubuntu:wght@400;700&family=Vollkorn:wght@400;700&display=swap">
<style>
/* ---------- prototype chrome (not part of the design) ---------- */
:root{
  --c-bg:#e9ecef; --c-panel:#ffffff; --c-line:#d5dade; --c-tx:#22303a; --c-mid:#45525c; --c-dim:#5f6c77;
  --c-acc:#234652; --c-acc-tx:#ffffff; --c-chip:#f1f3f5;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --c-bg:#14191e; --c-panel:#1e252c; --c-line:#323c46; --c-tx:#d7dee5; --c-mid:#b6c1cb; --c-dim:#93a0ab;
    --c-acc:#7fd1cc; --c-acc-tx:#10181d; --c-chip:#27313a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --c-bg:#14191e; --c-panel:#1e252c; --c-line:#323c46; --c-tx:#d7dee5; --c-mid:#b6c1cb; --c-dim:#93a0ab;
  --c-acc:#7fd1cc; --c-acc-tx:#10181d; --c-chip:#27313a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--c-bg); color:var(--c-tx);
  font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit; color:inherit}
.poc{position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:8px 14px; background:var(--c-panel); border-bottom:1px solid var(--c-line)}
.poc b.nm{font-size:13px; font-weight:700; margin-right:4px; white-space:nowrap}
.poc .sp{flex:1 1 auto}
.seg{display:inline-flex; border:1px solid var(--c-line); border-radius:999px; overflow:hidden; background:var(--c-chip)}
.seg button{border:0; background:transparent; padding:5px 11px; cursor:pointer; color:var(--c-mid); font-size:12px; white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--c-acc); color:var(--c-acc-tx); font-weight:600}
.pbtn{border:1px solid var(--c-line); background:var(--c-chip); border-radius:999px; padding:5px 12px; cursor:pointer; font-size:12px; font-weight:600; display:inline-flex; gap:6px; align-items:center}
.pbtn:hover{border-color:var(--c-mid)}
.pbtn .icon{width:14px; height:14px}
.stage{padding:18px 16px 40px; display:flex; justify-content:center}
.frame{width:100%; max-width:1680px; transition:max-width .25s ease; color-scheme:light}
.frame.tablet{max-width:768px}
.frame.phone{max-width:390px}
.frame.phone, .frame.tablet{box-shadow:0 0 0 1px var(--c-line), 0 14px 40px rgba(0,0,0,.12)}
@media (max-width:700px){ .stage{padding:0} .poc .hide-sm{display:none} }

.drawer{position:fixed; top:0; right:0; bottom:0; z-index:60; width:460px; max-width:100%;
  background:var(--c-panel); border-left:1px solid var(--c-line); box-shadow:-16px 0 40px rgba(0,0,0,.14);
  transform:translateX(105%); transition:transform .25s ease; display:flex; flex-direction:column}
.drawer.open{transform:none}
.dr-h{display:flex; align-items:center; gap:8px; padding:14px 16px; border-bottom:1px solid var(--c-line)}
.dr-h h2{margin:0; font-size:15px; flex:1}
.dr-h button{border:0; background:none; cursor:pointer; color:var(--c-mid); width:30px; height:30px; border-radius:50%; display:grid; place-items:center}
.dr-h button:hover{background:var(--c-chip)}
.dr-h .icon{width:14px; height:14px}
.dr-tabs{display:flex; padding:6px 16px 0; border-bottom:1px solid var(--c-line)}
.dr-tabs button{border:0; background:none; padding:8px 12px 10px; margin-bottom:-1px; cursor:pointer; color:var(--c-mid); font-size:13px; font-weight:600; border-bottom:2px solid transparent}
.dr-tabs button:hover{color:var(--c-tx)}
.dr-tabs button[aria-selected="true"]{color:var(--c-tx); border-bottom-color:var(--c-acc)}
.dr-tabs button:focus-visible{outline:2px solid var(--c-acc); outline-offset:-2px}
.dr-b{overflow-y:auto; padding:6px 16px 24px}
.dr-sec{padding:20px 0; border-bottom:1px solid var(--c-line)}
.dr-sec:last-child{border-bottom:0}
.dr-sec h3{margin:0 0 8px; font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--c-tx)}
.dr-sec p.hint{margin:6px 0 0; color:var(--c-mid); font-size:12px}
.presets{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.preset{border:1px solid var(--c-line); background:var(--c-panel); border-radius:6px; padding:0; cursor:pointer; overflow:hidden; text-align:left}
.preset[aria-pressed="true"]{outline:2px solid var(--c-acc); outline-offset:1px}
.preset .sw{height:30px; display:flex; align-items:center; gap:6px; padding:0 8px}
.preset .sw i{width:12px; height:12px; border-radius:50%; border:2px solid rgba(255,255,255,.7)}
.preset span{display:block; padding:6px 8px; font-size:11.5px; font-weight:600}
/* a theme card: click it to apply the theme, or the pencil to apply it and open its controls */
.preset{position:relative; cursor:default}
.preset .pa{display:block; width:100%; border:0; background:none; padding:0; cursor:pointer; text-align:left; color:inherit}
.preset .pe{position:absolute; top:3px; right:3px; width:26px; height:26px; border:0; border-radius:50%; background:rgba(255,255,255,.88); color:#22303a; display:grid; place-items:center; cursor:pointer; padding:0}
.preset .pe:hover{background:#fff}
.preset .pe .icon{width:13px; height:13px}
.pnew{margin-top:8px}
.dr-back{display:inline-flex; align-items:center; gap:7px; min-height:44px; border:0; background:none; padding:0; color:var(--c-acc); font-size:13px; font-weight:600; cursor:pointer}
.dr-back .icon{width:14px; height:14px}
.dr-back:hover{color:var(--c-tx)}
.dr-tt{display:block; width:100%; margin:0 0 4px; padding:4px 6px; font-size:16px; font-weight:700; color:var(--c-tx); border:1px solid transparent; border-radius:4px; background:transparent}
input.dr-tt:hover{border-color:var(--c-line)}
input.dr-tt:focus{border-color:var(--c-acc); outline:none; background:var(--c-chip)}
.fld{display:flex; align-items:center; gap:8px; margin-bottom:8px}
.fld label{flex:1 1 auto; font-size:12px; color:var(--c-mid)}
.fld input[type=color]{width:42px; height:28px; border:1px solid var(--c-line); border-radius:4px; padding:1px; background:var(--c-panel)}
.fld select{width:170px; padding:5px 6px; border:1px solid var(--c-line); border-radius:4px; background:var(--c-panel)}
.opts{display:flex; flex-wrap:wrap; gap:6px}
.opt{border:1px solid var(--c-line); background:var(--c-chip); border-radius:999px; padding:4px 11px; cursor:pointer; font-size:12px}
.opt[aria-pressed="true"]{background:var(--c-acc); border-color:var(--c-acc); color:var(--c-acc-tx); font-weight:600}
.wtog{display:flex; flex-direction:column; gap:6px}
.wtog label{display:flex; align-items:center; gap:8px; font-size:12.5px}
.wl{display:flex; flex-direction:column; gap:8px}
.wi{border:1px solid var(--c-line); border-radius:6px; padding:7px 8px; background:var(--c-panel)}
.wi.off{opacity:.62}
.wi .r1{display:flex; align-items:center; gap:6px}
.wi .r1 input[type=checkbox]{margin:0; flex:0 0 auto}
.wi .r1 .nm{flex:1 1 auto; min-width:0; font:inherit; font-size:12.5px; padding:4px 6px; border:1px solid var(--c-line); border-radius:4px; background:var(--c-panel); color:inherit}
.wi .r1 .nm:hover{border-color:var(--c-mid)}
.wi .r1 .nm:focus{border-color:var(--c-acc); outline:none; background:var(--c-chip)}
.wi .pos{font-size:10.5px; color:var(--c-dim); width:14px; text-align:right; flex:0 0 auto; font-variant-numeric:tabular-nums}
.mv{border:1px solid var(--c-line); background:var(--c-chip); border-radius:4px; width:26px; height:26px; cursor:pointer; color:var(--c-mid); font-size:13px; line-height:1; flex:0 0 auto; display:grid; place-items:center}
.mv:hover:not(:disabled){border-color:var(--c-mid); color:inherit}
.mv:disabled{opacity:.35; cursor:default}
.wi .r2{display:flex; align-items:center; gap:6px; margin:6px 0 0 34px}
/* a widget row: a drag grip, the editable name, and an eye that shows or hides it */
.wi{padding:8px 6px 9px 4px; transition:box-shadow .15s}
.wi .r1{gap:4px}
.wi .r2{margin-left:34px}
.grip{flex:0 0 auto; width:28px; height:32px; display:grid; place-items:center; border:0; background:none; padding:0; color:var(--c-dim); cursor:grab; border-radius:4px; touch-action:none}
.grip:hover{color:var(--c-tx); background:var(--c-chip)}
.grip:focus-visible{outline:2px solid var(--c-acc); outline-offset:-2px}
.grip .icon{width:10px; height:16px}
.wi.drag{position:relative; z-index:2; box-shadow:0 8px 22px rgba(0,0,0,.18); cursor:grabbing}
.wi.drag .grip{cursor:grabbing}
.eye{flex:0 0 auto; width:32px; height:32px; display:grid; place-items:center; border:0; background:none; padding:0; color:var(--c-acc); cursor:pointer; border-radius:4px}
.eye:hover{background:var(--c-chip)}
.eye:focus-visible{outline:2px solid var(--c-acc); outline-offset:-2px}
.eye .icon{width:18px; height:18px}
.wi.off .eye{color:var(--c-dim)}
.shb{flex:0 0 auto; margin-left:auto; border:1px solid var(--c-line); background:var(--c-panel); border-radius:999px; padding:3px 11px; min-height:28px; font-size:11.5px; font-weight:600; color:var(--c-mid); white-space:nowrap; cursor:pointer}
.shb:hover{border-color:var(--c-mid); color:var(--c-tx)}
.shb.off{background:var(--c-acc); border-color:var(--c-acc); color:var(--c-acc-tx)}
.shb.off:hover{filter:brightness(1.08); color:var(--c-acc-tx)}
.shb:focus-visible{outline:2px solid var(--c-acc); outline-offset:2px}
.wi .r1 .shb{margin-left:4px}
/* taller widget cards: name on top, view and actions on a bottom row */
.wl{gap:10px}
.wi{padding:12px 12px 12px 6px}
.wi .r2{margin:12px 0 0 34px; align-items:center; gap:8px}
.wi .r2b{display:flex; flex-wrap:wrap; justify-content:flex-end; gap:6px; margin-left:auto}
.wi .r2b .hbtn, .wi .r2b .shb{margin-left:0; min-height:30px}
.wi.wsub{padding:10px 10px 10px 10px}
.wi.wsub .r2{margin-left:0}
.wi.off .r2{opacity:1}
.wi.off .r2 .vseg, .wi.off .r2 .vseg-na{opacity:.55}
.wi.off .r1 .nm{text-decoration:line-through; text-decoration-color:var(--c-dim)}
.wi.off{opacity:1}
.wi.off .nm{opacity:.55}
/* every Hide Section / Show Section sits in the same place: the bottom-right corner of its section or widget card */
.sec-f{display:flex; justify-content:flex-end; margin-top:12px; padding-right:13px}
.shb{min-width:104px; text-align:center}
.wi .r2{justify-content:space-between}
.wi .r2b{flex-wrap:nowrap}
.dr-sec.off .rte-tb, .dr-sec.off .rte-ed, .dr-sec.off .hint, .dr-sec.off h3{opacity:.55}
/* a section title with its show/hide eye at the right; a hidden section's controls fade */
.sec-h{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:-6px -2px 4px 0}
.dr-sec .sec-h h3{margin:0}
.dr-sec.off .eye{color:var(--c-dim)}
.dr-sec.off .rte-tb, .dr-sec.off .rte-ed, .dr-sec.off .hint{opacity:.55}
/* the portal message editor: a wrapping toolbar over an editable box that grows with its content */
.rte-tb{display:flex; flex-wrap:wrap; align-items:center; gap:2px; padding:4px; border:1px solid var(--c-line); border-bottom:0; border-radius:6px 6px 0 0; background:var(--c-chip)}
.rte-tb select{height:28px; padding:0 4px; margin-right:4px; border:1px solid var(--c-line); border-radius:4px; background:var(--c-panel); font-size:12px}
.rte-tb button{width:28px; height:28px; display:grid; place-items:center; border:0; border-radius:4px; background:none; color:var(--c-mid); cursor:pointer; padding:0}
.rte-tb button:hover{background:var(--c-panel); color:var(--c-tx)}
.rte-tb button[aria-pressed="true"]{background:var(--c-panel); color:var(--c-acc); box-shadow:inset 0 0 0 1px var(--c-line)}
.rte-tb button:focus-visible, .rte-tb select:focus-visible{outline:2px solid var(--c-acc); outline-offset:-2px}
.rte-tb .icon{width:16px; height:16px}
.rte-tb .rg{font:15px/1 Georgia, serif; color:inherit}
.rte-tb b.rg{font-weight:700}
.rte-sep{width:1px; height:18px; margin:0 3px; background:var(--c-line)}
.rte-pop{display:flex; flex-wrap:wrap; gap:6px; padding:6px; border:1px solid var(--c-line); border-bottom:0; background:var(--c-panel)}
.rte-pop input[type=url]{flex:1 1 140px; min-width:0; padding:5px 8px; border:1px solid var(--c-line); border-radius:4px; background:var(--c-panel); font-size:12.5px}
.rte-pop input[type=url]:focus{outline:none; border-color:var(--c-acc)}
.rte-up{cursor:pointer}
.rte-ed{min-height:110px; max-height:280px; overflow:auto; padding:8px 10px; border:1px solid var(--c-line); border-radius:0 0 6px 6px; background:var(--c-panel); font-size:13px; line-height:1.5}
.rte-ed:focus{outline:none; border-color:var(--c-acc); box-shadow:0 0 0 1px var(--c-acc)}
.rte-ed > :first-child{margin-top:0}
.rte-ed p, .rte-ed h2, .rte-ed h3, .rte-ed h4, .rte-ed ul, .rte-ed ol{margin:0 0 .5em}
.rte-ed h2{font-size:17px} .rte-ed h3{font-size:15px} .rte-ed h4{font-size:13.5px}
.rte-ed ul, .rte-ed ol{padding-left:1.3em}
.rte-ed img{max-width:100%; height:auto}
.rte-ed a{color:var(--c-acc)}
/* the message as the portal shows it */
.wp-msg{margin:10px 0 0; max-width:60ch; font-size:16px; line-height:1.5; color:var(--mid)}
.wp-msg > *{margin:0 0 .55em}
.wp-msg > :last-child{margin-bottom:0}
.portal .wp-msg h2{font-size:1.2em} .portal .wp-msg h3{font-size:1.08em} .portal .wp-msg h4{font-size:1em}
.portal .wp-msg h2, .portal .wp-msg h3, .portal .wp-msg h4{color:var(--ink); font-family:var(--font-hd)}
.wp-msg ul, .wp-msg ol{padding-left:1.3em}
.wp-msg a{color:var(--accent-tx)}
.wp-msg img{max-width:100%; height:auto; border-radius:calc(var(--radius) * .5)}
.wp-msg hr{border:0; border-top:1px solid var(--line); margin:.8em 0}
@container portal (max-width:640px){ .wp-msg{font-size:15px} }
/* every widget the same height: rows share the tallest widget's height, and a short widget's "N more" link sits on its bottom edge */
.portal .grid{grid-auto-rows:1fr; align-items:stretch}
.portal .grid > .w{height:100%}
.portal .grid > .w > .w-ft{margin-top:auto}
/* widgets moved to the header (after Guest Portal Widgets v8): a bell for Notifications, and the avatar menu for Subscriptions and Payment Methods */
.hd-r{position:relative; display:flex; align-items:center; gap:6px; flex:0 0 auto}
.portal .hd-r > .me:first-child:not(:last-child){position:static}
.portal .bell{position:relative; width:40px; height:40px; border-radius:50%; border:0; background:none; padding:0; display:grid; place-items:center; color:var(--head-ink)}
.portal .bell .icon{width:20px; height:20px}
.portal .bell:hover, .portal .bell[aria-expanded="true"]{background:color-mix(in srgb, var(--head-ink) 18%, transparent)}
.portal .bell:focus-visible, .portal .av:focus-visible{outline:2px solid var(--head-ink); outline-offset:2px}
.bdg{position:absolute; top:2px; right:1px; min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:var(--imp); color:var(--imp-ink); font-size:11px; font-weight:700; line-height:1; display:grid; place-items:center; box-shadow:0 0 0 2px var(--head-bg); font-variant-numeric:tabular-nums}
.amenu{min-width:260px}
.menu button em{margin-left:auto; padding-left:12px; font-style:normal; font-size:12.5px; color:var(--dim); white-space:nowrap}
.menu button em.warn{color:var(--imp-tx); font-weight:700}
.menu .msep{height:1px; background:var(--line-2); margin:4px 0}
.bmenu{width:min(360px, calc(100cqw - 32px)); padding:0}
.bm-h{display:flex; align-items:baseline; gap:10px; padding:12px 14px 8px}
.bm-h b{font-size:15px}
.bm-h span{font-size:13px; color:var(--mid)}
.menu .bm-r{align-items:flex-start; gap:10px; padding:10px 14px; border-radius:0; border-top:1px solid var(--line-2)}
.bm-r .unr{flex:0 0 8px; width:8px; height:8px; border-radius:50%; margin:14px -4px 0 -6px}
.bm-r .unr.on{background:var(--accent)}
.bm-r .av-c{flex:0 0 auto; width:32px; height:32px; font-size:11.5px}
.bm-r .tx{flex:1 1 auto; min-width:0}
.bm-r .tx b{display:block; font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bm-r .tx span{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-size:13px; color:var(--mid); line-height:1.35}
.menu .bm-r em{padding-left:6px; font-size:12px}
.bm-none{margin:0; padding:12px 14px 14px; border-top:1px solid var(--line-2); font-size:13.5px; color:var(--mid)}
.bm-ft{border-top:1px solid var(--line-2); padding:4px}
.menu .bm-ft button{justify-content:center; color:var(--accent-tx); font-weight:600; font-size:14px}
/* the Move to Account Menu / Show as Bell Icon / Move Back to Page button on a widget row in Settings */
.hbtn{margin-left:auto; border:1px solid var(--c-line); background:var(--c-panel); border-radius:999px; padding:3px 10px; min-height:26px; font-size:11.5px; color:var(--c-mid); cursor:pointer; white-space:nowrap}
.hbtn:hover{border-color:var(--c-mid); color:var(--c-tx)}
.hbtn[aria-pressed="true"]{border-color:var(--c-acc); color:var(--c-acc)}
.hbtn:focus-visible{outline:2px solid var(--c-acc); outline-offset:1px}
.wi .r2{flex-wrap:wrap}
/* Billing's two sides share one grid cell; the hidden side still takes up space */
.bpanes{flex:1 1 auto; display:grid; min-width:0}
.bpane{grid-area:1 / 1; display:flex; flex-direction:column; min-width:0}
.bpane.off{visibility:hidden; pointer-events:none}
.bpane > .w-ft{margin-top:auto}
.logo-up{display:flex; align-items:center; gap:10px}
/* header background: three equal choices, then the controls for the one picked */
.hmode{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:6px; margin-bottom:12px}
.hmode .opt{padding:6px 4px; text-align:center; white-space:nowrap}
.himg{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:6px}
.himg.one{grid-template-columns:minmax(0, 1fr); margin-bottom:8px}
.himg.one button{height:72px}
.himg button{position:relative; height:52px; padding:0; border:1px solid var(--c-line); border-radius:6px; overflow:hidden; background:var(--c-chip) center/cover no-repeat; cursor:pointer; color:var(--c-tx); font-size:11px; font-weight:600}
.himg button span{position:absolute; left:0; right:0; bottom:0; padding:2px 6px; background:rgba(10,20,30,.55); color:#fff; text-align:left}
.himg button.none span{position:static; background:none; color:var(--c-mid)}
.himg button[aria-pressed="true"]{outline:2px solid var(--c-acc); outline-offset:1px}
.himg button:focus-visible{outline:2px solid var(--c-acc); outline-offset:2px}
.logo-up img{width:40px; height:40px; object-fit:contain; border:1px solid var(--c-line); border-radius:6px; padding:3px; background:var(--c-panel)}
/* Contact Details rows in Settings: icon, the value as the portal shows it, and its eye */
.crows{display:flex; flex-direction:column; gap:2px}
.crow{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--c-tx)}
.crow > .icon{width:14px; height:14px; flex:0 0 auto; color:var(--c-mid)}
.crow span{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.crow.off span, .crow.off > .icon{opacity:.5}
.crow.off .eye{color:var(--c-dim)}
.dr-sec h3 .h3-help{margin-left:6px; font-size:11.5px; font-weight:400; letter-spacing:0; text-transform:none; color:var(--c-mid)}
/* the grouped pair in Settings: one draggable card with an editable title, holding both widgets' own settings */
.wgrp .r1 .hbtn{margin-left:2px}
.wsubs{display:flex; flex-direction:column; gap:6px; margin:8px 0 2px 34px}
.wi.wsub{background:var(--c-chip); padding:6px 6px 8px 8px}
.wi.wsub .r2{margin-left:0}
/* List / Cards per widget in Settings */
.vseg{display:inline-flex; border:1px solid var(--c-line); border-radius:999px; overflow:hidden; background:var(--c-chip)}
.vseg button{border:0; background:none; padding:3px 12px; font-size:11.5px; color:var(--c-mid); cursor:pointer; min-height:26px}
.vseg button[aria-pressed="true"]{background:var(--c-acc); color:var(--c-acc-tx); font-weight:600}
.vseg button:focus-visible{outline:2px solid var(--c-acc); outline-offset:-2px}
.vseg-na{font-size:11.5px; color:var(--c-dim)}
.wi-note{margin:8px 0 0 34px; text-align:right}
.wi.wsub .wi-note{margin-left:0}
/* a widget in Cards view: its items as cards in a row you swipe or scroll through */
.w-body.w-cards{padding:2px 0 0}
.wcards{display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; overscroll-behavior-x:contain; padding:4px 16px 12px; scroll-padding:0 16px; scrollbar-width:thin}
.portal .wcards .cd{flex:0 0 min(84%, 290px); scroll-snap-align:start; box-shadow:none; background:color-mix(in srgb, var(--ink) 3%, var(--panel)); gap:8px; padding:13px 14px}
.portal .wcards .cd:hover{border-color:var(--accent)}
.wcards .cd .top .tx b{font-size:15px}
.wcards .cd .top .tx span, .wcards .cd .facts, .wcards .cd .prev{font-size:13px}
@container portal (max-width:640px){ .wcards{padding:4px 14px 10px; scroll-padding:0 14px} }
/* every card in every widget is the same height: long text is trimmed to two lines and actions sit on the bottom edge */
.portal .wcards .cd{height:196px; overflow:hidden}
/* Cards view keeps the List view's body height; each card is a quarter of it, four to a page */
/* Cards view is at least as tall as List view, and the grid grows to fill whatever height the row gives the widget */
.portal .w-body.w-cards{flex:1 1 auto; height:auto; min-height:calc(var(--slot) * 5 + 44px); display:flex; flex-direction:column; padding:2px 0 0}
.wtrack{flex:1 1 auto; min-height:0; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; overscroll-behavior-x:contain; scrollbar-width:none}
.wtrack::-webkit-scrollbar{display:none}
.wtrack:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.wpage{flex:0 0 100%; min-width:0; scroll-snap-align:start; display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); grid-template-rows:repeat(2, minmax(0, 1fr)); gap:8px; padding:4px 16px 8px 18px}
/* a page of one or two cards stacks them full width instead of leaving empty grid cells */
.wpage.stack{grid-template-columns:minmax(0, 1fr)}
.portal .wpage .cd{min-width:0; min-height:0; overflow:hidden; background:var(--panel); box-shadow:0 1px 2px rgba(16,32,48,.05), 0 2px 6px rgba(16,32,48,.04); gap:6px; padding:10px 11px}
.portal .wpage .cd:hover{border-color:var(--accent)}
/* in a quarter-size card the status or amount sits on its own line above the title, the round icon is dropped (as in List view), and only the first action shows */
.wpage .cd .top{gap:4px 8px; flex-wrap:wrap}
.wpage .cd .top .tr{order:-1; flex:1 0 100%; flex-direction:row; align-items:center; justify-content:space-between; gap:6px}
.wpage .cd .top .tr:empty{display:none}
.wpage .cd .top > .ic-c{display:none}
.wpage .cd .acts .btn ~ .btn{display:none}
.wpage .cd .top .ic-c, .wpage .cd .top .av-c{width:30px; height:30px}
.wpage .cd .top .tx b{font-size:14px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.wpage .cd .top .tx span{font-size:12.5px; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden}
.wpage .cd .top .tr .amt{font-size:14px !important}
.wpage .cd .facts, .wpage .cd .prog, .wpage .cd .prev{display:none}
.wpage .cd .acts{margin-top:auto; flex-wrap:nowrap; overflow:hidden}
.wpage .cd .acts .btn{padding:4px 9px; font-size:12.5px; min-height:0}
.wpg{display:flex; align-items:center; justify-content:center; gap:4px; padding:0 0 4px}
/* every button inside a widget's rows or cards is secondary: primary-colored border and text, no fill.
   The filled primary buttons are left to Needs Attention and the New button on Entries */
.portal .grid .w-body .btn, .portal .grid .w-body .btn.solid{background:transparent; border-color:var(--accent); color:var(--accent-tx); font-weight:600}
.portal .grid .w-body .btn:hover, .portal .grid .w-body .btn.solid:hover{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-tx)}
/* lesser actions (Download PDF, Add to Calendar, Make Default, Pay Early…) are ghost buttons: regular text color, no fill or border,
   and on hover a fill a shade off the Background color (the page shade) */
.portal .btn:not(.solid):not(.line), .portal .grid .w-body .btn:not(.solid):not(.line){background:transparent; border-color:transparent; color:var(--ink); font-weight:600}
.portal .btn:not(.solid):not(.line):hover, .portal .grid .w-body .btn:not(.solid):not(.line):hover{background:var(--page); border-color:transparent; color:var(--ink)}
.portal .btn:not(.solid):not(.line) .icon{color:var(--mid)}
/* larger widget headings: the title at 22px, its icon at 24px, and the › to match */
.portal .w .w-h h2{font-size:calc(22px * var(--hd-z, 1))}
.portal .w .w-ic .icon{width:24px; height:24px}
.portal .w .w-h .ttl-ch{width:17px; height:17px}
.portal .w-h{gap:10px}
/* breathing room under the last thing in a widget, whether that is a list, a card grid, or its "N more" link */
.portal .w-body:last-child{padding-bottom:16px}
.portal .bpane > .w-body:last-child{padding-bottom:16px}
.portal .w-ft{padding-bottom:18px}
.wpg .cbtn{width:30px; height:30px}
.wpg .dotb{height:30px}
@container portal (max-width:640px){ .wpage{padding:4px 14px 8px; gap:6px} }
.wcards .cd .top .tx b, .wcards .cd .top .tx span{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.wcards .cd .facts{max-height:2.9em; overflow:hidden}
.wcards .cd .acts{margin-top:auto}
/* Summarize as an on/off switch, so it reads as a setting rather than an action */
.swt{display:inline-flex; align-items:center; gap:7px; border:0; background:none; padding:3px 4px 3px 0; cursor:pointer; font-size:12px; color:var(--c-mid); border-radius:4px}
.swt:hover{color:var(--c-tx)}
.swt:focus-visible{outline:2px solid var(--c-acc); outline-offset:2px}
.swt-t{position:relative; flex:0 0 auto; width:28px; height:16px; border-radius:99px; background:var(--c-line); transition:background .15s}
.swt-t::after{content:""; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .15s}
.swt[aria-checked="true"]{color:var(--c-tx)}
.swt[aria-checked="true"] .swt-t{background:var(--c-acc)}
.swt[aria-checked="true"] .swt-t::after{transform:translateX(12px)}
@media (prefers-reduced-motion: reduce){ .wi, .swt-t, .swt-t::after{transition:none} }
.wi .r2 .opt{padding:2px 9px; font-size:11px}
.wi .lock{font-size:10.5px; color:var(--c-dim); margin-left:auto}
.attn-c{display:flex; flex-direction:column; gap:8px; margin-bottom:12px; padding-bottom:12px; border-bottom:1px dashed var(--c-line)}
.attn-c .fld{margin:0}
.attn-c .fld select{width:90px}
.file-in{font-size:11px; margin-top:6px; max-width:100%}

/* ---------- the portal ---------- */
.portal{
  --accent:#e2603f; --accent-ink:#fff; --accent-tx:#c2482a;
  --head-bg:#0f2f4a; --head-ink:#fff;
  --font-h:"Playfair Display",Georgia,serif; --font-b:"Source Sans 3",system-ui,sans-serif;
  --radius:12px; --ctl:8px;
  --ink:#1f2d38; --mid:#55656f; --dim:#7d8b95; --line:#e1e6ea; --line-2:#eef1f3;
  --page:color-mix(in srgb, var(--head-bg) 5%, #f5f6f7);
  --accent-soft:color-mix(in srgb, var(--accent) 11%, #fff);
  --accent-soft-2:color-mix(in srgb, var(--accent) 20%, #fff);
  container-type:inline-size; container-name:portal;
  position:relative; background:var(--page); color:var(--ink);
  font-family:var(--font-b); font-size:15px; line-height:1.45; min-height:640px;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
.portal *{box-sizing:border-box}
.portal button{font-family:inherit; cursor:pointer}
.portal .icon{width:16px; height:16px; flex:0 0 auto; display:block}
.portal h1,.portal h2,.portal h3,.portal h4{font-family:var(--font-h); margin:0; color:var(--ink); letter-spacing:-.005em}

/* header bar */
.ph{display:flex; align-items:center; gap:14px; height:64px; padding:0 28px; background:var(--head-bg); color:var(--head-ink)}
.ph .logo{display:flex; align-items:center; gap:11px; min-width:0}
.ph .logo .mk{width:36px; height:36px; flex:0 0 auto; display:grid; place-items:center}
.ph .logo .mk img{max-width:36px; max-height:36px; display:block}
.ph .logo b{font-family:var(--font-h); font-size:19px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ph .sp{flex:1 1 auto}
.ph .me{position:relative}
.ph .av{width:36px; height:36px; border-radius:50%; border:0; background:color-mix(in srgb, var(--head-ink) 18%, transparent);
  color:var(--head-ink); font-weight:700; font-size:13px; letter-spacing:.02em}
.ph .av:hover{background:color-mix(in srgb, var(--head-ink) 28%, transparent)}
.menu{position:absolute; top:calc(100% + 8px); right:0; z-index:30; min-width:230px; background:var(--panel); color:var(--ink);
  border:1px solid var(--line); border-radius:min(var(--radius), 10px); box-shadow:0 14px 34px rgba(16,32,48,.18); padding:6px; text-align:left}
.menu .mh{padding:8px 10px 10px; border-bottom:1px solid var(--line-2); margin-bottom:4px}
.menu .mh b{display:block; font-size:14.5px}
.menu .mh span{font-size:13px; color:var(--mid)}
.menu button{display:flex; align-items:center; gap:10px; width:100%; padding:9px 10px; border:0; background:none; border-radius:min(var(--radius), 6px); text-align:left; font-size:14.5px; color:var(--ink)}
.menu button:hover{background:var(--accent-soft)}
.menu button .icon{color:var(--mid)}
.menu .mcap{padding:6px 10px 4px; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--dim)}

/* hero: greeting, message, needs your attention */
.hero{background:var(--head-bg); color:var(--head-ink); padding:8px 28px 30px}
.hero .in{max-width:1520px; margin:0 auto}
.hero h1{color:inherit; font-size:30px; line-height:1.15; font-weight:700}
.hero .msg{margin:8px 0 0; max-width:70ch; font-size:15.5px; opacity:.86}
.hero .contact{display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:12px; font-size:14px}
.hero .contact a{display:inline-flex; align-items:center; gap:7px; color:inherit; text-decoration:none; opacity:.9}
.hero .contact a:hover{text-decoration:underline; opacity:1}
.attn{margin-top:22px}
.attn .cap{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; opacity:.85}
.attn .cap .ct{min-width:22px; height:22px; padding:0 7px; border-radius:999px; background:var(--accent); color:var(--accent-ink); display:inline-grid; place-items:center; font-size:12px; letter-spacing:0}
.attn .row{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px}
.ac{display:flex; flex-direction:column; gap:6px; min-height:104px; text-align:left; border:0; background:var(--panel); color:var(--ink);
  border-radius:var(--radius); padding:13px 15px; box-shadow:0 1px 2px rgba(10,20,30,.08); position:relative; overflow:hidden}
.ac::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--k,#d0dbdb)}
.ac:hover{box-shadow:0 0 0 2px var(--accent), 0 6px 18px rgba(10,20,30,.12)}
.ac .k{display:flex; align-items:center; gap:7px; font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--mid)}
.ac .k .icon{width:14px; height:14px}
.ac b{font-size:15.5px; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.ac .ft{margin-top:auto; display:flex; align-items:center; gap:8px; font-size:13px; color:var(--mid)}
.ac .ft .vb{margin-left:auto; color:var(--accent-tx); font-weight:700; white-space:nowrap}
.ac.more{background:color-mix(in srgb, #fff 88%, var(--head-bg))}
.ac.more::before{background:var(--accent)}
.ac.more b{font-weight:400; font-size:14px; color:var(--mid)}
.ac.done{align-items:center; flex-direction:row; gap:12px; min-height:58px; grid-column:1/-1}
.ac.done::before{background:#94cc3f}
.ac.done .icon{width:22px; height:22px; color:#4f7a1e}
.ac.done b{font-size:15px}
.ac.done span{color:var(--mid); font-size:14px}

/* dashboard grid */
.main{padding:26px 28px 44px}
/* a header image sits behind the top bar, the greeting, the welcome message, and the contact details, darkened so the white text stays readable */
.hbn{position:relative; background:#1d2730 var(--himg) center/cover no-repeat; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.35)}
.hbn::before{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(8,14,20,.62), rgba(8,14,20,.36) 50%, rgba(8,14,20,.58)); pointer-events:none}
.hbn > *{position:relative}
.hbn .ph{background:transparent; --head-ink:#fff}
.hbn .menu{text-shadow:none}
.hb-w{padding:22px 28px 38px}
.hb-w .in{max-width:1520px; margin:0 auto}
.hbn .wp{margin:0}
.portal .hbn .wp h1, .hbn .wp-msg, .hbn .wp-msg *, .hbn .wp-c a, .hbn .wp-c span, .hbn .wp-c .icon{color:#fff}
.hbn .wp-msg{opacity:.94}
.hbn .wp-c a:hover{color:#fff; text-decoration:underline}
@container portal (max-width:640px){ .hb-w{padding:14px 16px 26px} }
.main .in{max-width:1520px; margin:0 auto}
.grid{display:grid; grid-template-columns:minmax(0,1fr); gap:22px; align-items:start}
@container portal (min-width:700px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@container portal (min-width:1080px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr))} }

/* a widget */
.w{background:var(--panel); border-radius:var(--radius); border:1px solid var(--line); display:flex; flex-direction:column; min-width:0; position:relative}
.w-h{display:flex; align-items:center; gap:9px; padding:16px 16px 0 18px}
.w-h .btn.sm{padding:5px 10px}
.w-h .btn.ghost{padding:5px 6px}
.w-ic{width:34px; height:34px; border-radius:50%; background:var(--accent-soft); color:var(--accent-tx); display:grid; place-items:center; flex:0 0 auto}
.w-ic .icon{width:17px; height:17px}
.w-h h2{font-size:18px; font-weight:700; flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.w-h h2 button{all:unset; cursor:pointer}
.w-h h2 button:hover{text-decoration:underline; text-underline-offset:3px}
.w-acts{display:flex; align-items:center; gap:6px; flex:0 0 auto; position:relative}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; border:1px solid transparent; border-radius:var(--ctl);
  padding:7px 14px; font-size:14px; font-weight:600; line-height:1.2; white-space:nowrap; background:var(--accent-soft); color:var(--accent-tx)}
.btn:hover{background:var(--accent-soft-2)}
.btn.solid{background:var(--accent); color:var(--accent-ink)}
.btn.solid:hover{background:color-mix(in srgb, var(--accent) 86%, #000)}
.btn.ghost{background:transparent; color:var(--accent-tx); padding:7px 8px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.line{background:var(--panel); border-color:var(--line); color:var(--ink)}
.btn.line:hover{border-color:var(--accent); color:var(--accent-tx)}
.btn .icon{width:14px; height:14px}
.btn.sm{padding:5px 11px; font-size:13.5px}
.w-kpi{display:flex; align-items:center; gap:12px; padding:14px 18px 12px; min-height:76px; border-bottom:1px solid var(--line-2)}
.w-kpi .n{font-family:var(--font-h); font-size:32px; line-height:1; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; letter-spacing:-.02em; white-space:nowrap}
.w-kpi .l{min-width:0; font-size:13.5px; color:var(--mid); line-height:1.35}
.w-kpi .l b{display:block; color:var(--ink); font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.w-kpi .l span{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.w-kpi .end{margin-left:auto; flex:0 0 auto}
.w-kpi.muted .n{color:var(--dim)}
/* five slots, always: the widget is the same height with one item or five, so the
   portal does not rearrange itself as things come and go */
.w-body{--slot:60px; --slots:5; min-height:calc(var(--slot) * var(--slots) + 12px); padding:6px 8px; display:flex; flex-direction:column; position:relative}
.it{display:flex; align-items:center; gap:12px; min-height:var(--slot); width:100%; border:0; background:none; text-align:left;
  padding:8px 10px; border-radius:calc(var(--radius) * .6); color:var(--ink); min-width:0}
.it:hover{background:var(--accent-soft)}
.it + .it{box-shadow:0 -1px 0 var(--line-2)}
.it:hover, .it:hover + .it{box-shadow:none}
.it .lead{flex:0 0 auto; width:40px; display:grid; place-items:center}
.it .tx{flex:1 1 auto; min-width:0}
.it .tx b{display:block; font-size:15px; font-weight:600; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.it .tx span{display:block; font-size:13.5px; color:var(--mid); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.it .tr{flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; gap:3px}
.it .amt{font-size:15px; font-weight:700; font-variant-numeric:tabular-nums}
.it .new{width:8px; height:8px; border-radius:50%; background:var(--accent); flex:0 0 auto}
.w-ft{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 18px 14px; border-top:1px solid var(--line-2); font-size:13px; color:var(--mid); min-height:50px}
.w-ft .lk{border:0; background:none; padding:2px 0; color:var(--accent-tx); font-weight:600; font-size:13.5px}
.w-ft .lk:hover{text-decoration:underline}
.w-ft .sep{color:var(--line)}
.w-ft .gap{flex:1 1 auto}

/* leading visuals */
.dt-tile{width:40px; border-radius:calc(var(--radius) * .5); overflow:hidden; text-align:center; background:var(--accent-soft); line-height:1}
.dt-tile i{display:block; font-style:normal; font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:4px 0 3px; background:var(--accent); color:var(--accent-ink)}
.dt-tile b{display:block; font-size:17px; font-weight:700; padding:4px 0 5px; color:var(--ink); font-variant-numeric:tabular-nums}
.dt-tile.past{background:#f1f3f4}
.dt-tile.past i{background:#c6cfd4; color:#3d4b54}
.dt-tile.pay i{background:#f9cf62; color:#755506}
.av-c{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font-size:12.5px; font-weight:700; color:#fff; background:var(--c,#55727b)}
.av-c.ann{background:var(--accent-soft); color:var(--accent-tx)}
.av-c .icon{width:17px; height:17px}
.fi{width:30px; height:36px}
.fi svg{width:30px; height:36px; display:block}
.ic-c{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; background:var(--bg,#f1f3f4); color:var(--fg,#4b6363)}
.ic-c .icon{width:17px; height:17px}

/* status pills: entry-status swatches only */
.pill{display:inline-flex; align-items:center; gap:6px; padding:2px 9px 2px 8px; border-radius:999px; font-size:12.5px; font-weight:600; white-space:nowrap;
  background:color-mix(in srgb, var(--sw) 30%, #fff); color:var(--swt)}
.pill i{width:7px; height:7px; border-radius:50%; background:var(--sw)}
.sw-green{--sw:#94cc3f; --swt:#365115}
.sw-yellow{--sw:#f9cf62; --swt:#755506}
.sw-red{--sw:#eba49f; --swt:#82231c}
.sw-teal{--sw:#73d6d3; --swt:#1b5a56}
.sw-gray{--sw:#d0dbdb; --swt:#4b6363}

/* null states: ghost rows in the same five slots, with the reason to care over them */
.null{position:absolute; inset:6px 8px; display:flex; flex-direction:column}
.null .ghost{display:flex; align-items:center; gap:12px; height:var(--slot); padding:8px 10px; opacity:.55}
.null .ghost + .ghost{box-shadow:0 -1px 0 var(--line-2)}
.null .ghost .g1{width:38px; height:38px; border-radius:calc(var(--radius) * .5); background:var(--accent-soft-2)}
.null .ghost .g2{flex:1; display:flex; flex-direction:column; gap:7px}
.null .ghost .g2 i{display:block; height:9px; border-radius:99px; background:#e6eaed}
.null .ghost .g2 i:first-child{width:62%}
.null .ghost .g2 i:last-child{width:38%; background:#eef1f3}
.null .ghost .g3{width:58px; height:18px; border-radius:99px; background:#eef1f3}
.null .ov{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:8px;
  padding:18px 26px; background:linear-gradient(to bottom, color-mix(in srgb, var(--panel) 55%, transparent), color-mix(in srgb, var(--panel) 94%, transparent) 30%, color-mix(in srgb, var(--panel) 94%, transparent) 75%, color-mix(in srgb, var(--panel) 60%, transparent))}
.null .ov b{font-family:var(--font-h); font-size:17px; color:var(--ink)}
.null .ov p{margin:0; font-size:14px; color:var(--mid); max-width:36ch}
.null .ov .pts{display:flex; flex-wrap:wrap; justify-content:center; gap:6px 14px; margin-top:4px; font-size:13px; color:var(--mid)}
.null .ov .pts span{display:inline-flex; align-items:center; gap:5px}
.null .ov .pts .icon{width:13px; height:13px; color:var(--accent-tx)}
.startlist{display:flex; flex-direction:column; gap:6px; padding:6px 4px}
.startlist .cap{font-size:13.5px; color:var(--mid); padding:4px 6px 6px}
.startlist button{display:flex; align-items:center; gap:10px; border:1px dashed var(--line); background:var(--panel); border-radius:calc(var(--radius) * .6); padding:10px 12px; text-align:left; font-size:15px; font-weight:600; color:var(--ink)}
.startlist button:hover{border-color:var(--accent); background:var(--accent-soft)}
.startlist button .icon{color:var(--accent-tx)}
.startlist button .go{margin-left:auto; color:var(--dim)}

/* New menu */
.nmenu{min-width:260px}
.nmenu.at-w{left:0; right:auto}
.nmenu button .icon{color:var(--accent-tx)}

/* drill-in pages */
.pg{padding:22px 28px 48px}
.pg .in{max-width:1080px; margin:0 auto}
.back{display:inline-flex; align-items:center; gap:7px; border:0; background:none; padding:4px 0; color:var(--accent-tx); font-weight:600; font-size:14.5px; margin-bottom:12px}
.back:hover{text-decoration:underline}
.pg-h{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.pg-h h1{font-size:28px; font-weight:700; flex:1 1 auto; min-width:0}
.pg-kpi{display:flex; align-items:center; gap:14px; margin:14px 0 18px; padding:16px 18px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius)}
.pg-kpi .n{font-family:var(--font-h); font-size:34px; font-weight:700; line-height:1; white-space:nowrap}
.pg-kpi .l{color:var(--mid); font-size:14.5px; min-width:0}
.pg-kpi .l b{display:block; color:var(--ink)}
.pg-kpi .end{margin-left:auto}
.tools{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px}
.search{flex:1 1 240px; display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--in-b); border-radius:var(--ctl); padding:0 12px; min-height:42px}
.search .icon{color:var(--dim)}
.search input{border:0; outline:0; background:none; flex:1; min-width:0; font-size:15px; padding:9px 0; font-family:inherit}
.search:focus-within{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft-2)}
.sortsel{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--mid)}
.sortsel select{min-height:42px; border:1px solid var(--in-b); border-radius:var(--ctl); background:var(--panel); padding:0 10px; font-family:inherit; font-size:14.5px; color:var(--ink)}
.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px}
.chip{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:6px 13px; font-size:14px; color:var(--ink)}
.chip em{font-style:normal; color:var(--dim); font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.chip[aria-pressed="true"] em{color:inherit; opacity:.8}
.chip.list .icon{width:14px; height:14px}
.grp{margin-bottom:26px}
.grp h3{font-size:16px; font-weight:700; margin:0 0 10px; display:flex; align-items:baseline; gap:8px}
.grp h3 em{font-style:normal; font-family:var(--font-b); font-size:13.5px; font-weight:400; color:var(--dim)}
.grp .note{margin:-4px 0 12px; font-size:13.5px; color:var(--mid)}
.cards{display:grid; grid-template-columns:minmax(0,1fr); gap:12px}
@container portal (min-width:700px){ .cards{grid-template-columns:repeat(2,minmax(0,1fr))} }
.cd{display:flex; flex-direction:column; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:15px 16px; text-align:left; color:var(--ink); min-width:0}
.cd:hover{border-color:var(--accent); box-shadow:0 4px 14px rgba(10,20,30,.07)}
.cd .top{display:flex; gap:12px; align-items:flex-start}
.cd .top .tx{flex:1; min-width:0}
.cd .top .tx b{display:block; font-size:16px; line-height:1.3}
.cd .top .tx span{display:block; font-size:14px; color:var(--mid); margin-top:2px}
.cd .top .tr{display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex:0 0 auto}
.cd .facts{display:flex; flex-wrap:wrap; gap:4px 16px; font-size:13.5px; color:var(--mid)}
.cd .facts span{display:inline-flex; align-items:center; gap:6px}
.cd .facts .icon{width:14px; height:14px; color:var(--dim)}
.cd .acts{display:flex; gap:8px; flex-wrap:wrap; margin-top:2px}
.cd .prev{font-size:14px; color:var(--mid); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.prog{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--mid)}
.prog .tr{flex:0 0 90px; height:6px; border-radius:99px; background:var(--line-2); overflow:hidden}
.prog .tr i{display:block; height:100%; background:var(--accent)}
.none{padding:34px 18px; text-align:center; color:var(--mid); background:var(--panel); border:1px dashed var(--line); border-radius:var(--radius)}

/* detail */
.dt{display:grid; grid-template-columns:minmax(0,1fr); gap:20px}
@container portal (min-width:880px){ .dt{grid-template-columns:minmax(0,1fr) 300px} }
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px}
.panel + .panel{margin-top:16px}
.dt h1{font-size:26px; line-height:1.2}
.dt .sub{margin:6px 0 0; color:var(--mid)}
.dt .acts{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px}
.facts-g{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px 20px; margin:18px 0 0}
.facts-g div{min-width:0}
.facts-g dt{font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--dim)}
.facts-g dd{margin:3px 0 0; font-size:15px}
.side h4{font-size:15px; margin-bottom:10px}
.side .ln{display:flex; align-items:center; gap:10px; width:100%; border:0; background:none; padding:9px 0; text-align:left; color:var(--ink); border-top:1px solid var(--line-2); font-size:14.5px}
.side .ln:first-of-type{border-top:0}
.side .ln .icon{color:var(--accent-tx)}
.side .ln span{flex:1; min-width:0}
.side .ln:hover span{text-decoration:underline}
.side p{margin:0; font-size:14px; color:var(--mid)}
.email{margin-top:18px; padding-top:16px; border-top:1px solid var(--line-2); font-size:15px}
.email p{margin:0 0 10px}
.att{display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:calc(var(--radius) * .6); padding:9px 12px; background:var(--panel); margin-top:8px; width:100%; text-align:left; font-size:14.5px}
.att:hover{border-color:var(--accent)}
.att .fi{width:24px; height:30px}
.att .fi svg{width:24px; height:30px}
.att em{font-style:normal; color:var(--dim); margin-left:auto; font-size:13px}
.lines{margin-top:18px; border-top:1px solid var(--line-2)}
.lines .li{display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--line-2); font-size:15px}
.lines .li span{flex:1}
.lines .li b{font-variant-numeric:tabular-nums}
.lines .li.tot{border-bottom:0; font-weight:700}
.docprev{margin-top:18px; background:#f3f5f6; border-radius:calc(var(--radius) * .6); padding:22px; display:flex; justify-content:center}
.docprev .pgx{width:min(380px,100%); aspect-ratio:8.5/11; background:#fff; box-shadow:0 2px 10px rgba(0,0,0,.1); padding:26px 24px; display:flex; flex-direction:column; gap:9px}
.docprev .pgx b{font-family:var(--font-h); font-size:15px}
.docprev .pgx i{display:block; height:7px; border-radius:99px; background:#e8ecef}
.docprev .pgx i.s{width:60%}
.docprev .pgx .sig{margin-top:auto; display:flex; gap:14px}
.docprev .pgx .sig div{flex:1; border-top:1px solid #9aa7b0; padding-top:5px; font-size:10.5px; color:var(--mid)}
.docprev .pgx .sig div.need{border-top:2px solid var(--accent); color:var(--accent-tx); font-weight:700}
.parties{margin-top:6px}
.parties .p{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line-2); font-size:14.5px}
.parties .p:first-child{border-top:0}
.parties .p span{flex:1}

/* the form a New opens: a page inside the portal, not an overlay, so it works in any embed */
.fm{max-width:720px}
.fm .panel{padding:24px}
.fm .row2{display:grid; grid-template-columns:minmax(0,1fr); gap:16px}
@container portal (min-width:620px){ .fm .row2{grid-template-columns:1fr 1fr} }
.f{display:flex; flex-direction:column; gap:6px; margin-bottom:16px}
.f label{font-weight:700; font-size:15.5px}
.f label .rq{color:#c0392b; margin-left:2px}
.f .help{font-size:13px; color:var(--dim)}
.inp{width:100%; font-family:inherit; font-size:15px; color:#333; background:#fff; border:1px solid var(--in-b); border-radius:var(--ctl); padding:9px 11px; min-height:44px}
textarea.inp{min-height:96px; resize:vertical}
.inp:focus{outline:0; border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft-2)}
.fm .foot{display:flex; gap:10px; justify-content:flex-start; margin-top:6px; flex-wrap:wrap}
.fm .foot .btn{padding:10px 20px; font-size:15px}
.fm .lede{color:var(--mid); margin:6px 0 18px}

/* forms widget: each form with New, its Public views beneath with the customer's counts, lined up with New */
.fw{display:flex; flex-direction:column}
.fw-f{display:flex; align-items:center; gap:10px; min-height:46px; padding:6px 10px}
.fw-f b{flex:1 1 auto; min-width:0; font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fw-f .btn{min-width:74px}
.fw-v{display:flex; align-items:center; gap:10px; width:100%; min-height:40px; border:0; background:none; text-align:left; padding:6px 10px 6px 30px; border-radius:calc(var(--radius) * .6); color:var(--ink); font-size:14.5px}
.fw-v:hover{background:var(--accent-soft)}
.fw-v .icon{color:var(--dim)}
.fw-v span{flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fw-v em{font-style:normal; font-variant-numeric:tabular-nums; color:var(--mid); font-weight:600; min-width:74px; text-align:center}
.fw-f + .fw-f, .fw-v + .fw-f{box-shadow:0 -1px 0 var(--line-2)}
.it .pay{flex:0 0 auto}
.w-ft .more3{display:none}
.attn .cap .all{margin-left:auto; border:0; background:none; color:inherit; padding:0; font-size:13.5px; font-weight:700; letter-spacing:0; text-transform:none; text-decoration:underline; text-underline-offset:3px}
.menu .ppl-m{padding:3px 10px; font-size:13px; color:var(--mid)}
.menu .ppl-m b{color:var(--ink); font-weight:600}
.menu .ppl-m:last-of-type{padding-bottom:10px; border-bottom:1px solid var(--line-2); margin-bottom:4px}

/* a Public view: the organization's columns, read-only */
.vt{overflow-x:auto; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius)}
.vt table{width:100%; border-collapse:collapse; font-size:14.5px}
.vt th{text-align:left; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap}
.vt td{padding:11px 14px; border-bottom:1px solid var(--line-2); white-space:nowrap}
.vt tbody tr:last-child td{border-bottom:0}
.vt tbody tr{cursor:pointer}
.vt tbody tr:hover td{background:var(--accent-soft)}

/* histories (reminders, revisions) and plan lists on detail pages */
.tl{margin-top:20px; padding-top:16px; border-top:1px solid var(--line-2)}
.tl h4{font-size:15px; margin-bottom:6px}
.tl .ev{display:flex; gap:10px; align-items:center; padding:7px 0; font-size:14.5px}
.tl .ev .icon{color:var(--dim)}
.tl .ev span{flex:1; min-width:0}
.tl .ev em{font-style:normal; color:var(--mid); font-size:13.5px; white-space:nowrap; font-variant-numeric:tabular-nums}
.plan{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:11px 0; border-top:1px solid var(--line-2)}
.plan:first-child{border-top:0}
.plan .tx{flex:1 1 200px; min-width:0}
.plan .tx b{display:block; font-size:15.5px}
.plan .tx span{font-size:14px; color:var(--mid)}

/* a conversation: every email sent about one submission, oldest first */
.cmsg{display:flex; gap:12px; padding:16px 0; border-top:1px solid var(--line-2)}
.cmsg:first-child{border-top:0}
.cmsg .bd{flex:1; min-width:0}
.cmsg .hd{display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 10px}
.cmsg .hd b{font-size:15px}
.cmsg .hd span{font-size:13.5px; color:var(--mid)}
.cmsg p{margin:8px 0 0; font-size:15px}
.hero .contact .hrs{display:inline-flex; align-items:center; gap:7px; opacity:.9}
.mv .icon{width:13px; height:13px}

/* profile */
.prof h3{font-size:17px; font-weight:700}
.prof .sec{margin-top:20px; padding-top:16px; border-top:1px solid var(--line-2)}
.prof .sec h3{margin-bottom:4px}
.ppl .p{display:flex; align-items:center; gap:12px; padding:9px 0}
.ppl .p + .p{border-top:1px solid var(--line-2)}
.ppl .p .tx{flex:1; min-width:0}
.ppl .p b{display:block; font-size:15px}
.ppl .p .tx span{font-size:13.5px; color:var(--mid)}
.tg{display:flex; align-items:center; gap:14px; padding:10px 0}
.tg + .tg{border-top:1px solid var(--line-2)}
.tg .tx{flex:1; min-width:0}
.tg b{display:block; font-size:15px}
.tg .tx span{font-size:13.5px; color:var(--mid)}
/* the switch is drawn inside a 52 by 44 hit area so it meets the 44px touch target */
.tgl{position:relative; width:52px; height:44px; border:0; background:none; flex:0 0 auto; padding:0}
.tgl::before{content:""; position:absolute; left:2px; right:2px; top:9px; height:26px; border-radius:999px; background:#c6cfd4; transition:background .15s}
.tgl::after{content:""; position:absolute; top:12px; left:5px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.2); transition:left .15s}
.tgl[aria-checked="true"]::before{background:var(--accent)}
.tgl[aria-checked="true"]::after{left:27px}
.tgl:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion: reduce){ .tgl::before, .tgl::after{transition:none} }

/* forms open in a dialog over the portal. The scrim covers the portal, which stands in for the device screen here;
   the dialog stays in view as the page scrolls, and goes nearly full screen on a narrow container. */
.dlg-scrim{position:absolute; inset:0; z-index:35; background:rgba(16,32,48,.45); padding:16px; display:flex; justify-content:center; align-items:flex-start}
.dlg{position:sticky; top:72px; width:100%; max-width:650px; max-height:calc(100vh - 96px); overflow:auto; background:var(--panel); border-radius:var(--radius); box-shadow:0 20px 50px rgba(10,20,30,.3); padding:28px 32px 24px}
.dlg h2{font-size:24px; font-weight:700; padding-right:28px; text-wrap:balance}
.dlg .lede{color:var(--mid); margin:6px 0 18px}
.dlg-x{position:absolute; top:10px; right:10px; width:36px; height:36px; border:0; background:none; color:var(--dim); display:grid; place-items:center; padding:0}
.dlg-x:hover{color:var(--ink)}
.dlg-x:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.dlg .row2{display:grid; grid-template-columns:minmax(0,1fr); gap:16px}
@container portal (min-width:620px){ .dlg .row2{grid-template-columns:1fr 1fr} }
.dlg .foot{display:flex; gap:10px; flex-wrap:wrap; margin-top:8px}
.dlg .foot .btn{padding:10px 20px; font-size:15px}
.dlg .foot .save{margin-left:auto}
@container portal (max-width:640px){
  .dlg-scrim{padding:16px 8px}
  .dlg{top:62px; padding:22px 18px 18px; max-height:calc(100vh - 80px)}
  .dlg .foot .btn{flex:1 1 100%}
  .dlg .foot .save{margin-left:0}
}

/* field styles */
.portal.fs-underline .inp, .portal.fs-underline .search, .portal.fs-underline .sortsel select{border-width:0 0 1.5px; border-radius:0; background:transparent}
.portal.fs-underline .search{background:transparent}
.portal.fs-fill .inp, .portal.fs-fill .search, .portal.fs-fill .sortsel select{border-color:transparent; background:color-mix(in srgb, var(--head-bg) 7%, #f3f5f6)}
.portal.fs-fill .w, .portal.fs-fill .cd, .portal.fs-fill .panel, .portal.fs-fill .pg-kpi{border-color:transparent; box-shadow:0 1px 2px rgba(10,20,30,.06)}

/* toast */
.toasts{position:absolute; left:50%; bottom:18px; transform:translateX(-50%); z-index:40; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:max-content; max-width:92%}
.toast{background:var(--hd-c); color:var(--hd-ink); padding:10px 16px; border-radius:var(--ctl); font-size:14px; box-shadow:0 10px 26px rgba(0,0,0,.24); animation:tin .2s ease}
@keyframes tin{from{opacity:0; transform:translateY(6px)}}

/* phone: summaries lead, three slots, tighter gutters */
@container portal (max-width:640px){
  .ph{padding:0 16px; height:58px}
  .ph .logo b{font-size:17px}
  .hero{padding:4px 16px 20px}
  .hero h1{font-size:24px}
  .hero .msg{font-size:14.5px}
  .attn .row{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:4px; margin:0 -16px; padding-left:16px; padding-right:16px; scrollbar-width:none}
  .attn .row::-webkit-scrollbar{display:none}
  .ac{flex:0 0 76%; scroll-snap-align:start}
  .ac.done{flex:1 1 auto}
  .main{padding:18px 16px 32px}
  .grid{gap:16px}
  .w-body{--slots:3}
  .w-body .it:nth-of-type(n+4), .w-body .w-grp.g4{display:none}
  .w-ft .more5{display:none}
  .w-ft .more3{display:inline-flex}
  .null .ghost:nth-child(n+4){display:none}
  .w-h{padding:14px 14px 0}
  .w-kpi{padding:12px 14px 10px}
  .w-ft{padding:10px 14px 12px}
  .pg{padding:16px 16px 36px}
  .pg-h h1{font-size:24px}
  .pg-kpi{flex-wrap:wrap}
  .pg-kpi .end{margin-left:0; width:100%}
  .pg-kpi .end .btn{width:100%}
  .dt h1{font-size:22px}
  .panel{padding:16px}
  .btn{min-height:40px}
}

/* calmer treatment: plain sections with one quiet summary line, dots for status, two columns,
   widgets sized by their content, a slim header, and accent color kept for things you can click */
.portal{--ink:#234652}
.ph{height:56px}
.hero{padding:6px 28px 22px}
.hero h1{font-size:24px}
.hero .msg{font-size:14.5px; margin-top:6px}
.hero .contact{font-size:13px; margin-top:10px; opacity:.85}
.main{padding:24px 28px 44px}
.grid{gap:30px 32px; --rg:30px}
@container portal (min-width:1080px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr))} .grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))} }
/* masonry: once measured, each widget spans as many 2px rows as it is tall plus the gap, so short widgets don't leave holes */
.grid.mz{grid-auto-rows:2px; row-gap:0}
.w{background:none; border:0; border-radius:0}
.w-ic{display:none}
.w-h{padding:0 0 4px}
.w-h h2{font-family:var(--font-b); font-size:19px}
.w-kpi{display:block; min-height:0; padding:0 0 10px; border:0; font-size:13.5px; color:var(--mid)}
.w-kpi .n{font-family:var(--font-b); font-size:13.5px; font-weight:700; color:var(--ink); letter-spacing:0; margin-right:.3em}
.w-kpi.muted .n{color:var(--ink)}
.w-kpi .l, .w-kpi .l b, .w-kpi .l span{display:inline; font-size:13.5px; white-space:normal}
.w-kpi .l b{color:var(--ink); font-weight:700}
.w-kpi .l span::before{content:" · "}
.w-kpi .l span:empty::before{content:none}

.w-body{min-height:0; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:4px 6px}
.w-body:has(.null){min-height:calc(var(--slot) * 3 + 12px)}
.it .lead:has(.ic-c){display:none}
.w-ft{border-top:0; padding:8px 2px 0; min-height:0}
.dt-tile{background:var(--line-2)}
.dt-tile i{background:#d9e1e6; color:var(--mid)}
.dt-tile.pay i{background:#f9cf62; color:#755506}
.pill{background:none; padding:0; color:var(--ink); font-weight:600; gap:7px}
.pill i{width:8px; height:8px}
.fw-f .btn{background:none; border-color:var(--line); color:var(--accent-tx)}
.fw-f .btn:hover{background:none; border-color:var(--accent)}
.ac, .host-slot .ac, .cd:hover{box-shadow:none}
.portal.fs-fill .w{box-shadow:none}
.portal.fs-fill .w-body{border-color:transparent; box-shadow:0 1px 2px rgba(10,20,30,.06)}

/* a summarized widget: its totals in place of its rows */
.w-body.sum{padding:18px 20px}
.sm-n{display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 8px}
.sm-n b{font-size:30px; font-weight:700; line-height:1; color:var(--ink); font-variant-numeric:tabular-nums}
.sm-n span{font-size:15px; font-weight:600; color:var(--ink)}
.sm-s{margin:6px 0 0; font-size:13.5px; color:var(--mid)}
.sm-bar{display:flex; gap:2px; height:8px; margin:16px 0 12px; border-radius:2px; overflow:hidden}
.sm-bar i{display:block; background:var(--sw); min-width:4px}
.sm-lg{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:6px 18px; font-size:13.5px}
.sm-lg li{display:flex; align-items:center; gap:8px; min-width:0}
.sm-lg li i{width:8px; height:8px; border-radius:50%; background:var(--sw); flex:0 0 auto}
.sm-lg li span{flex:1; min-width:0; color:var(--ink)}
.sm-lg li em{font-style:normal; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink)}

/* needs your attention: one strip with the count and what kind of things, the most urgent few listed, the rest a click away */
.ab{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:30px}
.ab-h{display:flex; align-items:center; gap:12px; width:100%; border:0; background:none; text-align:left; padding:14px 18px; color:var(--ink)}
.ab-h > .icon{width:20px; height:20px; color:#d85427}
.ab-h .tx{flex:1; min-width:0}
.ab-h .tx b{display:block; font-size:16px}
.ab-h .tx span{font-size:13.5px; color:var(--mid)}
.ab-h .tg2{display:inline-flex; align-items:center; gap:6px; color:var(--accent-tx); font-weight:600; font-size:14px; white-space:nowrap}
.ab-h .tg2 .icon{width:13px; height:13px}
.ab-l{border-top:1px solid var(--line-2)}
.ab-r{display:flex; align-items:center; gap:12px; width:100%; border:0; background:none; text-align:left; padding:11px 18px; color:var(--ink); font-size:14.5px}
.ab-r + .ab-r{border-top:1px solid var(--line-2)}
.ab-r:hover{background:var(--accent-soft)}
.ab-r > .icon{color:var(--mid)}
.ab-r .tx{flex:1; min-width:0}
.ab-r .tx b{display:block; font-weight:600}
.ab-r .tx span{font-size:13px; color:var(--mid)}
.ab-r .vb{color:var(--accent-tx); font-weight:600; white-space:nowrap}
.ab-ft{display:flex; justify-content:flex-end; padding:10px 18px; border-top:1px solid var(--line-2); font-size:13.5px}
.ab-ft button{border:0; background:none; color:var(--accent-tx); font-weight:600; padding:0}
.ab-ft button:hover{text-decoration:underline}
@container portal (max-width:640px){
  .hero{padding:4px 16px 16px}
  .hero h1{font-size:21px}
  .main{padding:16px 16px 32px}
  .w-h{padding:0 0 4px}
  .w-kpi{padding:0 0 8px}
  .w-ft{padding:8px 2px 0}
  .ab{margin-bottom:22px}
  .ab-h, .ab-r, .ab-ft{padding-left:14px; padding-right:14px}
}

/* each widget is one white panel again: its title, New button, rows and "N more" link all sit inside it */
.w{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius)}
.w-h{padding:14px 16px 8px 18px}
.w-body{background:none; border:0; border-radius:0; padding:0 8px}
.w-body.sum{padding:6px 18px 14px}
.w-ft{padding:8px 18px 14px; border-top:1px solid var(--line-2)}
.portal.fs-fill .w{border-color:transparent; box-shadow:0 1px 2px rgba(10,20,30,.06)}
.portal.fs-fill .w-body{border-color:transparent; box-shadow:none}
@container portal (max-width:640px){
  .w-h{padding:12px 14px 6px}
  .w-body{padding:0 6px}
  .w-body.sum{padding:6px 14px 12px}
  .w-ft{padding:8px 14px 12px}
}

/* the attention band reads like the other widgets: a title with its count, the most urgent rows, and Show More at the bottom */
.ab-h{padding:14px 18px 10px; gap:10px}
.ab-h h2{font-family:var(--font-b); font-size:19px; font-weight:700; margin:0}
.ab-h h2 button{all:unset; cursor:pointer}
.ab-h h2 button:hover{text-decoration:underline; text-underline-offset:3px}
.ab-h h2 button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.ab-ct{min-width:24px; height:22px; padding:0 8px; border-radius:999px; background:var(--line-2); color:var(--ink); font-size:13px; font-weight:700; display:inline-grid; place-items:center; font-variant-numeric:tabular-nums}
.ab-ft{justify-content:flex-start}

/* an empty widget's placeholder rows stay inside its panel now that widgets size to their content */
.w-body:has(.null){overflow:hidden}
.null .ghost:nth-child(n+4){display:none}

/* hover changes a link's color instead of underlining it: titles turn the accent color, accent links go a shade darker */
.hero .contact a:hover{text-decoration:none; opacity:1; color:color-mix(in srgb, var(--accent) 50%, var(--head-ink))}
.hero .contact a{transition:color .15s}
.wp{display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:end; gap:18px 48px; margin:10px 0 30px}
.wp h1{font-size:34px; font-weight:700; line-height:1.1; letter-spacing:-.02em; text-wrap:balance}
.wp-tx > p:last-child{margin:10px 0 0; max-width:60ch; font-size:16px; line-height:1.5; color:var(--mid)}
.wp-c{display:flex; flex-direction:column; align-items:flex-start; gap:4px; min-width:0}
.wp-c a, .wp-c span{display:inline-flex; align-items:center; gap:9px; padding:3px 0; font-size:14px; color:var(--ink); text-decoration:none; white-space:nowrap}
.wp-c span{color:var(--mid)}
.wp-c .icon{width:15px; height:15px; color:var(--accent-tx)}
.wp-c a{transition:color .15s}
.wp-c a:hover{color:var(--accent-tx)}
@container portal (max-width:820px){ .wp{grid-template-columns:minmax(0,1fr)} .wp-c{flex-direction:row; flex-wrap:wrap; gap:4px 20px} }
@container portal (max-width:640px){ .wp{margin:4px 0 22px} .wp h1{font-size:26px} .wp-tx > p:last-child{font-size:15px} .wp-c a, .wp-c span{white-space:normal} }
@media (prefers-reduced-motion: reduce){ .wp-c a, .hero .contact a{transition:none} }
.w-h h2 button:hover, .ab-h h2 button:hover{text-decoration:none; color:var(--accent-tx)}
.side .ln:hover span{text-decoration:none; color:var(--accent-tx)}
.w-ft .lk:hover, .back:hover, .ab-ft button:hover{text-decoration:none; color:color-mix(in srgb, var(--accent-tx) 68%, #000)}
.w-h h2 button, .ab-h h2 button, .side .ln span, .w-ft .lk, .back{transition:color .15s}
@media (prefers-reduced-motion: reduce){ .w-h h2 button, .ab-h h2 button, .side .ln span, .w-ft .lk, .back{transition:none} }

/* a chevron after each widget title shows it opens the full page; it takes the title's hover color and nudges right */
.w-h h2 button, .ab-h h2 button{display:inline-flex; align-items:center; gap:6px; max-width:100%}
.portal .ttl-ch{width:15px; height:15px; color:var(--dim); transition:color .15s, transform .15s}
.w-h h2 button:hover .ttl-ch, .ab-h h2 button:hover .ttl-ch, .w-h h2 button:focus-visible .ttl-ch, .ab-h h2 button:focus-visible .ttl-ch{color:currentColor; transform:translateX(2px)}
@media (prefers-reduced-motion: reduce){ .portal .ttl-ch{transition:none} .w-h h2 button:hover .ttl-ch, .ab-h h2 button:hover .ttl-ch{transform:none} }

/* needs your attention as a slider: as many cards as the dashboard has columns, the rest a swipe or an arrow away */
.atn{margin-bottom:30px; --pv:2; --cg:32px}
@container portal (min-width:1080px){ .atn.c3{--pv:3} }
@container portal (max-width:640px){ .atn{margin-bottom:22px; --cg:12px} }
.car-track{display:flex; gap:var(--cg); overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; overscroll-behavior-x:contain; padding:4px; margin:-4px}
.car-track::-webkit-scrollbar{display:none}
.car-track:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--radius)}
.car-item{flex:0 0 calc((100% - var(--cg) * (var(--pv) - 1)) / var(--pv)); min-width:0; display:flex; scroll-snap-align:start}
@container portal (max-width:640px){ .car-item{flex-basis:82%} }
.car-item > .tc{flex:1 1 auto}
.car-nav{display:flex; align-items:center; justify-content:center; gap:4px; margin-top:8px}
.cbtn{width:36px; height:36px; display:grid; place-items:center; border:1px solid var(--line); border-radius:50%; background:var(--panel); color:var(--ink); padding:0; transition:border-color .15s, color .15s}
.cbtn:hover:not(:disabled){border-color:var(--accent); color:var(--accent-tx)}
.cbtn:disabled{opacity:.4; cursor:default}
.portal .cbtn .flip{transform:scaleX(-1)}
.dots{display:flex}
.dotb{width:22px; height:36px; border:0; background:none; padding:0; position:relative}
.dotb::after{content:""; position:absolute; inset:0; margin:auto; width:7px; height:7px; border-radius:99px; background:color-mix(in srgb, var(--ink) 28%, var(--page)); transition:width .2s ease, background .2s ease}
.dotb.on::after{width:20px; background:var(--accent)}
.cbtn:focus-visible, .dotb:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:99px}
@media (prefers-reduced-motion: reduce){ .cbtn, .dotb::after{transition:none} }
.tc{display:flex; flex-direction:column; gap:10px; min-width:0; text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; color:var(--ink)}
.tc:hover{border-color:var(--accent)}
.tc:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.tc-f{display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700; color:var(--mid)}
.tc-f .icon{width:14px; height:14px}
.tc-f > span{min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tc-f .dot{margin-left:auto; flex:0 0 auto; width:8px; height:8px; border-radius:50%; background:var(--sw)}
.tc-m{display:flex; align-items:flex-start; gap:10px; min-width:0}
.tc-m .fi{width:24px; height:30px; flex:0 0 auto}
.tc-m .fi svg{width:24px; height:30px}
.tc-m .tx{flex:1 1 auto; min-width:0}
.tc-m .tx b{display:block; font-size:15.5px; line-height:1.3}
.tc-m .tx span{display:block; font-size:13.5px; color:var(--mid); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tc-amt{flex:0 0 auto; font-size:15.5px; font-weight:700; font-variant-numeric:tabular-nums}
.tc-pp{display:flex; padding-left:6px}
.tc-pp i{width:26px; height:26px; margin-left:-6px; border-radius:50%; border:2px solid var(--panel); background:var(--head-bg); color:var(--head-ink); display:grid; place-items:center; font-style:normal; font-size:10.5px; font-weight:700}
.tc-b{margin-top:auto; display:flex; align-items:center; flex-wrap:wrap; gap:8px}
.tc-b .meta{flex:1 1 auto; min-width:0; font-size:13px; color:var(--mid)}
.tc-b .meta.hot{color:var(--hd-c); font-weight:700}
.tc-b .btn{flex:0 0 auto}
.atn-h{display:flex; align-items:center; gap:10px; margin-bottom:6px}
.portal .atn-h h2{font-family:var(--font-hd); color:var(--hd-c); font-weight:var(--hd-w); font-size:calc(19px * var(--hd-z, 1))}
.atn-h .lk{margin-left:auto; border:0; background:none; padding:0; min-height:44px; color:var(--accent-tx); font-weight:600; font-size:14px; transition:color .15s}
.portal .atn-h .ab-ct{background:var(--hd-c); color:var(--hd-ink)}
.atn-h .lk:hover{color:color-mix(in srgb, var(--accent-tx) 68%, #000)}
@media (prefers-reduced-motion: reduce){ .atn-h .lk{transition:none} }
.host-slot .tc{box-shadow:none}

/* the settings pane's reset button sits under its tabs' content */
.dr-ft{padding:12px 16px 16px; border-top:1px solid var(--c-line)}

/* a widget's required note sits right under its title (Subscriptions, §13) */

/* a widget that ends with its last row, not a footer, keeps the same breathing room at the bottom */

.w-body.sum:last-child{padding-bottom:16px}

/* the item modal from a drill-in page: same content as an item page, 800px wide, nearly full screen on a phone */

.im-side{border-top:1px solid var(--line-2); padding-top:16px}

/* embedded in the organization's own site */
.host{background:#fff; font-family:"Open Sans",system-ui,sans-serif; color:#2b3540}

.host-bar .hl{display:flex; align-items:center; gap:10px; font-weight:700; font-size:16px; color:#1b242d; white-space:nowrap}

.host-title{max-width:1240px; margin:0 auto; padding:30px 28px 0}

.host-title h1{margin:4px 0 0; font-size:30px; color:#1b242d}
.host-slot{max-width:1296px; margin:0 auto; padding:0 0 10px}
.host-slot .portal{min-height:0; background:transparent}
.host-slot .hero{background:transparent; color:var(--ink); padding-top:14px}
.host-slot .hero .msg{opacity:1; color:var(--mid)}
.host-slot .attn .cap{opacity:1; color:var(--mid)}
.host-slot .ac{border:1px solid var(--line); box-shadow:none}
.host-slot .main{padding-top:6px}

@media (max-width:700px){ .host-bar nav{display:none} .host-bar .who span{display:none} }
.frame.phone .host-bar nav, .frame.phone .host-bar .who span{display:none}

/* the organization's form theme, element by element: title, headings, labels, text, links, buttons, placeholder, and colors */
.portal{font-size:calc(15px * var(--tx-z, 1))}
.portal h1, .portal .dlg h2{font-family:var(--font-t); color:var(--title-c); font-weight:var(--title-w)}
.portal .wp h1{font-size:calc(34px * var(--title-z, 1))}
.portal .pg-h h1{font-size:calc(28px * var(--title-z, 1))}

@container portal (max-width:640px){

}

.portal .grp h3, .portal .side h4, .portal .tl h4, .portal .prof h3, .portal .null .ov b{font-family:var(--font-hd); color:var(--hd-c); font-weight:var(--hd-w)}

.portal ::placeholder{color:var(--ph); opacity:1}
.portal .ph .logo b{font-family:var(--font-t)}
.portal .hero h1{color:inherit}

/* the rest of the field-style presets */
.portal.fs-chunk .inp, .portal.fs-chunk .search, .portal.fs-chunk .sortsel select{border-width:2px}

.poc label.pk{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--c-mid)}
.poc select{border:1px solid var(--c-line); background:var(--c-chip); color:var(--c-tx); border-radius:999px; padding:5px 10px; font-size:12px; font-weight:600}

/* the theme editor: one group per form theme element */
.te{display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:6px; align-items:center}
.te select{min-width:0; width:100%; padding:5px 6px; border:1px solid var(--c-line); border-radius:4px; background:var(--c-panel)}

.it .unr{flex:0 0 8px; width:8px; height:8px; border-radius:50%; margin:0 -6px 0 -2px}

.w-grp{display:flex; align-items:center; gap:7px; padding:12px 10px 4px; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--mid)}
.w-grp:first-child{padding-top:2px}
.w-grp i{width:8px; height:8px; border-radius:50%; background:var(--sw)}

.dt-tile i{background:var(--head-bg); color:var(--head-ink)}

/* ---------- dates, relative to today so the prototype never goes stale ---------- */
const NOW = new Date();
const TODAY = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
const day = (n, h, m) => { const d = new Date(TODAY); d.setDate(d.getDate() + n); d.setHours(h || 0, m || 0); return d; };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const fDate = d => MON[d.getMonth()] + " " + d.getDate();
const fDay = d => DOW[d.getDay()] + ", " + fDate(d);
const fLong = d => fDay(d) + ", " + d.getFullYear();
const fTime = d => { let h = d.getHours(), m = d.getMinutes(); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return h + ":" + String(m).padStart(2, "0") + " " + ap; };
const daysFrom = d => Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - TODAY) / 864e5);
function ago(d){
  const n = -daysFrom(d);
  if (n <= 0){ const hrs = Math.max(1, Math.round((NOW - d) / 36e5)); return hrs < 20 ? hrs + (hrs === 1 ? " hour ago" : " hours ago") : "Today"; }
  if (n === 1) return "Yesterday";
  if (n < 7) return n + " days ago";
  return fDate(d);
}
function soon(d){
  const n = daysFrom(d);
  if (n === 0) return "Today";
  if (n === 1) return "Tomorrow";
  if (n > 1 && n < 7) return DOW[d.getDay()];
  return fDay(d);
}

const lum = h => { const [r, g, b] = rgb(h).map(lin); return .2126 * r + .7152 * g + .0722 * b; };
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
const inkOn = h => contrast(h, "#ffffff") >= 3.2 ? "#ffffff" : "#1b242d";
function mixHex(h, t, f){ const a = rgb(h), b = rgb(t); return "#" + a.map((v, i) => Math.round((v + (b[i] - v) * f) * 255).toString(16).padStart(2, "0")).join(""); }
function readable(h){ let c = h, f = 0; while (contrast(c, "#ffffff") < 4.6 && f < 1){ f += .06; c = mixHex(h, "#000000", f); } return c; }
