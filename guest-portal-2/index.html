.tc-b .meta.hot{color:var(--hd-c); font-weight:700}
.tc-b .btn{flex:0 0 auto}
.atn-h{display:flex; align-items:center; gap:10px; margin-bottom:6px}
.portal .atn-h h2{font-family:var(--font-hd); color:var(--hd-c); font-weight:var(--hd-w); font-size:calc(19px * var(--hd-z, 1))}
.atn-h .lk{margin-left:auto; border:0; background:none; padding:0; min-height:44px; color:var(--accent-tx); font-weight:600; font-size:14px; transition:color .15s}
.portal .atn-h .ab-ct{background:var(--hd-c); color:var(--hd-ink)}
.atn-h .lk:hover{color:color-mix(in srgb, var(--accent-tx) 68%, #000)}
@media (prefers-reduced-motion: reduce){ .atn-h .lk{transition:none} }
.host-slot .tc{box-shadow:none}

/* the settings pane's reset button sits under its tabs' content */
.dr-ft{padding:12px 16px 16px; border-top:1px solid var(--c-line); display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap}

/* a widget's required note sits right under its title (Subscriptions, §13) */
.w-sub{margin:-4px 18px 8px; font-size:13.5px; color:var(--mid)}
@container portal (max-width:640px){ .w-sub{margin:-2px 14px 6px} }

/* a widget that ends with its last row, not a footer, keeps the same breathing room at the bottom */
.w-body:last-child{padding-bottom:10px}
.w-body.sum:last-child{padding-bottom:16px}

/* the item modal from a drill-in page: same content as an item page, 800px wide, nearly full screen on a phone */
.dlg.im{max-width:800px; padding:26px 30px 28px}
.im .back{margin-bottom:6px}
.im h1{padding-right:30px}
.im .dt{gap:24px}
.im-side h4{margin-top:2px}
/* related links and signatures run along the bottom of the modal at every width */
.im .dt{grid-template-columns:minmax(0,1fr); gap:20px}
.im-side{border-top:1px solid var(--line-2); padding-top:16px}
@container portal (max-width:640px){ .dlg.im{padding:22px 18px 20px} }

/* embedded in the organization's own site */
.host{background:#fff; font-family:"Open Sans",system-ui,sans-serif; color:#2b3540}
.host-bar{display:flex; align-items:center; gap:26px; height:64px; padding:0 28px; background:#fff; border-bottom:1px solid #e3e7ea}
.host-bar .hl{display:flex; align-items:center; gap:10px; font-weight:700; font-size:16px; color:#1b242d; white-space:nowrap}
.host-bar nav{display:flex; gap:22px; font-size:14px; color:#5a6773; overflow:hidden}
.host-bar nav span{white-space:nowrap}
.host-bar nav span.on{color:#1b242d; font-weight:700}
.host-bar .who{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:13.5px; color:#5a6773; white-space:nowrap}
.host-bar .who i{width:32px; height:32px; border-radius:50%; background:#e8ecef; display:grid; place-items:center; font-style:normal; font-weight:700; font-size:12px; color:#1b242d}
.host-title{max-width:1240px; margin:0 auto; padding:30px 28px 0}
.host-title small{font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#8a95a0}
.host-title h1{margin:4px 0 0; font-size:30px; color:#1b242d}
.host-slot{max-width:1296px; margin:0 auto; padding:0 0 10px}
.host-slot .portal{min-height:0; background:transparent}
.host-slot .hero{background:transparent; color:var(--ink); padding-top:14px}
.host-slot .hero .msg{opacity:1; color:var(--mid)}
.host-slot .attn .cap{opacity:1; color:var(--mid)}
.host-slot .ac{border:1px solid var(--line); box-shadow:none}
.host-slot .main{padding-top:6px}
.host-foot{border-top:1px solid #e3e7ea; padding:18px 28px 26px; font-size:12.5px; color:#6b7783; display:flex; gap:20px; flex-wrap:wrap}
@media (max-width:700px){ .host-bar nav{display:none} .host-bar .who span{display:none} }
.frame.phone .host-bar nav, .frame.phone .host-bar .who span{display:none}
.frame.phone .host-title{padding:20px 16px 0}
.frame.phone .host-title h1{font-size:24px}

/* the organization's form theme, element by element: title, headings, labels, text, links, buttons, placeholder, and colors */
.portal{font-size:calc(15px * var(--tx-z, 1))}
.portal h1, .portal .dlg h2{font-family:var(--font-t); color:var(--title-c); font-weight:var(--title-w)}
.portal .wp h1{font-size:calc(34px * var(--title-z, 1))}
.portal .pg-h h1{font-size:calc(28px * var(--title-z, 1))}
.portal .dt h1{font-size:calc(26px * var(--title-z, 1))}
.portal .dlg h2{font-size:calc(24px * var(--title-z, 1))}
@container portal (max-width:640px){
  .portal .wp h1{font-size:calc(26px * var(--title-z, 1))}
  .portal .pg-h h1{font-size:calc(24px * var(--title-z, 1))}
  .portal .dt h1{font-size:calc(22px * var(--title-z, 1))}
}
.portal .w-h h2, .portal .ab-h h2{font-family:var(--font-hd); color:var(--hd-c); font-weight:var(--hd-w); font-size:calc(19px * var(--hd-z, 1))}
.portal .grp h3, .portal .side h4, .portal .tl h4, .portal .prof h3, .portal .null .ov b{font-family:var(--font-hd); color:var(--hd-c); font-weight:var(--hd-w)}
.portal .f label{font-family:var(--font-lb); color:var(--lb-c); font-weight:var(--lb-w); font-size:calc(15.5px * var(--lb-z, 1))}
.portal .btn{font-family:var(--font-btn)}
.portal .btn.solid{background:var(--btn-bg); color:var(--btn-c); font-weight:var(--btn-w)}
.portal .btn.solid:hover{background:color-mix(in srgb, var(--btn-bg) 86%, #000)}
.portal ::placeholder{color:var(--ph); opacity:1}
.portal .ph .logo b{font-family:var(--font-t)}
.portal .hero h1{color:inherit}

/* the rest of the field-style presets */
.portal.fs-chunk .inp, .portal.fs-chunk .search, .portal.fs-chunk .sortsel select{border-width:2px}
.portal.fs-inset .inp, .portal.fs-inset .search, .portal.fs-inset .sortsel select{box-shadow:inset 0 1px 3px rgba(0,0,0,.16)}
.portal.fs-roundedfill .inp, .portal.fs-roundedfill .search, .portal.fs-roundedfill .sortsel select{border-color:transparent; background:color-mix(in srgb, var(--ink) 6%, var(--panel))}

/* the portal picker in the prototype bar */
.poc label.pk{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--c-mid)}
.poc select{border:1px solid var(--c-line); background:var(--c-chip); color:var(--c-tx); border-radius:999px; padding:5px 10px; font-size:12px; font-weight:600}

/* the theme editor: one group per form theme element */
.te{display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:6px; align-items:center}
.te select{min-width:0; width:100%; padding:5px 6px; border:1px solid var(--c-line); border-radius:4px; background:var(--c-panel)}
.te input[type=color], .te2 input[type=color]{width:38px; height:28px; border:1px solid var(--c-line); border-radius:4px; padding:1px; background:var(--c-panel)}
.te .b{width:30px; height:28px; border:1px solid var(--c-line); border-radius:4px; background:var(--c-chip); font-weight:800; cursor:pointer; color:var(--c-mid)}
.te .b[aria-pressed="true"]{background:var(--c-acc); color:var(--c-acc-tx); border-color:var(--c-acc)}
.te .sz{grid-column:1 / -1}
.te2{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 8px; align-items:center; font-size:12px; color:var(--c-mid)}

/* v6 */
.ph button.logo{border:0; background:none; padding:0; color:inherit; text-align:left; min-height:44px}
.it .unr{flex:0 0 8px; width:8px; height:8px; border-radius:50%; margin:0 -6px 0 -2px}
.it .unr.on{background:var(--accent)}
.side .ln, .parties .p, .tl .ev{align-items:flex-start}
.side .ln > .icon, .parties .p > .icon, .tl .ev > .icon{margin-top:calc((1.45em - 16px) / 2)}
.wp-c a, .wp-c span{align-items:flex-start}
.wp-c .icon{margin-top:calc((1.45em - 15px) / 2)}
.w-grp{display:flex; align-items:center; gap:7px; padding:12px 10px 4px; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--mid)}
.w-grp:first-child{padding-top:2px}
.w-grp i{width:8px; height:8px; border-radius:50%; background:var(--sw)}
.w-grp em{font-style:normal; font-weight:600; letter-spacing:0; color:var(--dim)}
.dt-tile i{background:var(--head-bg); color:var(--head-ink)}
.dt-tile.pay i{background:color-mix(in srgb, var(--head-bg) 26%, var(--panel)); color:var(--ink)}
.dt-tile.past i{background:var(--line); color:var(--mid)}
.search{min-height:44px}
.fwrap{position:relative; flex:0 0 auto}
.fbtn{position:relative; display:grid; place-items:center; width:44px; height:44px; border:1px solid var(--in-b); border-radius:var(--ctl); background:var(--panel); color:var(--ink); padding:0}
.fbtn:hover, .fbtn[aria-expanded="true"]{border-color:var(--accent); color:var(--accent-tx)}
.fbtn .fct{position:absolute; top:-6px; right:-6px; min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:var(--accent); color:var(--accent-ink); font-size:11px; font-weight:700; display:grid; place-items:center}
.fmenu{min-width:240px; padding:8px}
.fsel{display:flex; flex-direction:column; gap:4px; padding:6px 4px; font-size:13px; font-weight:600; color:var(--mid)}
.fsel select{min-height:44px; border:1px solid var(--in-b); border-radius:var(--ctl); background:var(--panel); padding:0 10px; font-family:inherit; font-size:14.5px; color:var(--ink)}
.portal.fs-underline .fbtn, .portal.fs-underline .fsel select{border-width:0 0 1.5px; border-radius:0; background:transparent}
.portal.fs-fill .fbtn, .portal.fs-fill .fsel select{border-color:transparent; background:color-mix(in srgb, var(--head-bg) 7%, #f3f5f6)}
.portal.fs-roundedfill .fbtn, .portal.fs-roundedfill .fsel select{border-color:transparent; background:color-mix(in srgb, var(--ink) 6%, var(--panel))}
.portal.fs-chunk .fbtn, .portal.fs-chunk .fsel select{border-width:2px}
.dlg.cdlg{max-width:520px}
.cdlg h2{margin-bottom:18px}
.f .err{display:block; margin-top:-6px; padding:4px 10px; background:#c0392b; color:#fff; font-size:13px; border-radius:0 0 min(var(--ctl), 10px) min(var(--ctl), 10px)}
.f.bad .inp{border-color:#c0392b; box-shadow:0 0 0 3px rgba(192,57,43,.12)}
.btn[disabled]{opacity:.7; cursor:default}

.dt-tile i{background:var(--sec); color:var(--sec-ink)}
.dt-tile.pay i{background:color-mix(in srgb, var(--sec) 32%, var(--panel)); color:var(--ink)}
.dt-tile.past i{background:var(--line); color:var(--mid)}
.tc-b .meta.hot{color:var(--imp-tx)}
.portal .atn-h .ab-ct{background:var(--imp); color:var(--imp-ink)}
.cal{margin:0 0 8px; padding:6px 8px; border-radius:4px; font-size:11.5px; color:var(--c-tx)}
.cal.warn{background:color-mix(in srgb, #f9cf62 30%, var(--c-panel))}
.cal.err{background:color-mix(in srgb, #eba49f 35%, var(--c-panel))}
.ck{display:flex; gap:8px; align-items:flex-start; font-size:12.5px; color:var(--c-tx)}
.ck input{margin:2px 0 0}
.adv summary{cursor:pointer; min-height:32px; display:flex; align-items:center; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--c-dim)}
.adv .fld{flex-wrap:wrap}
.fav{display:block; width:32px; height:32px; margin-bottom:6px; object-fit:contain}
.tl-l{position:relative; display:inline-flex; align-items:center; gap:2px}
.tip{position:static; display:grid; place-items:center; width:44px; height:44px; margin:-12px -12px -12px -10px; border:0; background:none; padding:0; color:var(--c-dim); cursor:pointer}
.tip .icon{width:14px; height:14px; border-radius:50%}
.tip:hover, .tip:focus-visible, .tip.on{color:var(--c-tx)}
.tip:focus-visible{outline:2px solid var(--c-acc); outline-offset:-10px; border-radius:50%}
/* a soft lift under every card so it reads above the page shade; the slider track pads its bottom so the shadow isn't clipped */
.portal .w, .portal .tc, .portal .cd, .portal .panel, .portal .pg-kpi, .portal .vt{box-shadow:0 1px 2px rgba(16,32,48,.05), 0 4px 12px rgba(16,32,48,.06)}
.car-track{padding:4px 4px 12px; margin:-4px -4px -12px}
/* each widget title leads with its icon, drawn plain in a muted tint of the text color */
.portal .w-ic{display:grid; width:auto; height:auto; background:none; border-radius:0; color:color-mix(in srgb, var(--ink) 55%, var(--panel))}
.portal .w-ic .icon{width:20px; height:20px}
/* research: the finish button, the "isn't here" notes in Settings, and the confirm-then-survey dialog */
.pbtn.go{background:var(--c-acc); border-color:var(--c-acc); color:var(--c-acc-tx); text-decoration:none}
.pbtn.go:hover{border-color:var(--c-acc); filter:brightness(1.08)}
.pbtn:focus-visible{outline:2px solid var(--c-acc); outline-offset:2px}
.wish-in{display:flex; gap:6px}
.wish-in input{flex:1 1 auto; min-width:0; padding:6px 8px; border:1px solid var(--c-line); border-radius:4px; background:var(--c-panel); font-size:12.5px}
.wish-in input:focus{outline:none; border-color:var(--c-acc)}
.wish-l{list-style:none; margin:8px 0 0; padding:0; display:flex; flex-direction:column; gap:4px}
.wish-l li{display:flex; align-items:flex-start; gap:6px; padding:5px 4px 5px 8px; background:var(--c-chip); border-radius:4px; font-size:12.5px}
.wish-l li span{flex:1 1 auto; min-width:0; overflow-wrap:anywhere}
.wish-l button{flex:0 0 auto; width:24px; height:24px; border:0; background:none; color:var(--c-mid); cursor:pointer; display:grid; place-items:center; border-radius:50%}
.wish-l button:hover{background:var(--c-line); color:var(--c-tx)}
.wish-l .icon{width:11px; height:11px}
.sd-scrim{position:fixed; inset:0; z-index:70; background:rgba(10,20,30,.45); display:grid; place-items:center; padding:16px}
.sd{width:min(520px, 100%); max-height:calc(100vh - 32px); overflow:auto; background:var(--c-panel); color:var(--c-tx); border-radius:10px; padding:22px 22px 18px; box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sd h2{margin:0 0 6px; font-size:18px}
.sd p{margin:0 0 14px; color:var(--c-mid)}
.sd-ok{display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border:1px solid var(--c-line); border-radius:8px; background:var(--c-chip); cursor:pointer; font-weight:600}
.sd-ok input{margin:2px 0 0; width:16px; height:16px; flex:none; accent-color:var(--c-acc)}
.pbtn.go[aria-disabled="true"]{opacity:.45; pointer-events:none}
.sd-f{display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; margin-top:18px}
.sd-f .pbtn{padding:8px 14px; font-size:13px}
.rng{display:flex; align-items:center; gap:10px}
.rng input{flex:1 1 auto; min-width:0; accent-color:var(--c-acc)}
.tip:hover::after, .tip:focus-visible::after, .tip.on::after{content:attr(data-tip); position:absolute; z-index:5; top:calc(100% + 2px); left:0; width:230px; padding:8px 10px; border-radius:6px; background:var(--c-tx); color:var(--c-panel); font-size:11.5px; line-height:1.45; font-weight:400; text-align:left; box-shadow:0 6px 18px rgba(0,0,0,.18)}

/* Entries: All or just My Submissions */
.scope{display:inline-flex; gap:2px; padding:3px; border-radius:999px; background:var(--line-2)}
.scope button{border:0; background:none; border-radius:999px; padding:5px 12px; font-size:13.5px; color:var(--mid); white-space:nowrap; min-height:32px}
.scope button em{font-style:normal; font-variant-numeric:tabular-nums; color:var(--mid); margin-left:2px}
.scope button:hover{color:var(--ink)}
.scope button[aria-pressed="true"]{background:var(--panel); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(16,32,48,.12)}
.scope button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.w-scope{padding:0 18px 8px}
.pg-scope{margin:0 0 12px}
@container portal (max-width:640px){ .w-scope{padding:0 14px 6px} }
/* first-visit tip pointing at Settings */
.intro{position:fixed; z-index:60; width:min(300px, calc(100vw - 32px)); background:var(--c-acc); color:var(--c-acc-tx); border-radius:10px; padding:14px 38px 14px 16px; box-shadow:0 10px 30px rgba(0,0,0,.25); font-size:13.5px; line-height:1.45}
.intro::before{content:""; position:absolute; top:-6px; left:var(--ax, 50%); width:12px; height:12px; margin-left:-6px; background:inherit; transform:rotate(45deg); border-radius:2px}
.intro b{display:block; font-size:14px; margin-bottom:4px}
.intro p{margin:0}
.intro .x{position:absolute; top:8px; right:8px; width:26px; height:26px; border:0; border-radius:6px; background:transparent; color:inherit; cursor:pointer; display:grid; place-items:center; opacity:.8}
.intro .x:hover{opacity:1; background:rgba(255,255,255,.14)}
.intro .x .icon{width:14px; height:14px}
.intro .ok{margin-top:10px; border:1px solid currentColor; background:transparent; color:inherit; border-radius:999px; padding:4px 12px; font-size:12px; font-weight:600; cursor:pointer}
.intro .x:focus-visible, .intro .ok:focus-visible{outline:2px solid currentColor; outline-offset:2px}
/* the ? button left of Settings, and the help dialog it opens */
.pbtn.q{width:28px; height:28px; padding:0; justify-content:center; font-size:13px; font-weight:700}
.sd ol{margin:4px 0 0; padding-left:1.4em; color:var(--c-tx)}
.sd ol li{margin-bottom:10px; line-height:1.5}
.sd ol li:last-child{margin-bottom:0}
/* ---------- widgets from Guest Portal Widget Explorations: Upcoming calendar, Invoices balance + list,
   Documents preview cards, Quotes expiry timeline + list, Subscriptions combined ---------- */
.vseg.ev button{padding:3px 9px}
.x-sum{margin:2px 10px 10px; padding:14px 16px 12px; border-radius:calc(var(--radius) * .5); background:color-mix(in srgb, var(--ink) 3%, var(--panel)); border:1px solid var(--line-2)}
.x-cap{display:flex; align-items:baseline; gap:8px; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--mid)}
.x-cap em{margin-left:auto; font-style:normal; font-weight:400; letter-spacing:0; text-transform:none; font-size:13px}
.x-big{display:block; margin-top:2px; font-family:var(--font-hd); font-size:32px; font-weight:700; line-height:1.1; letter-spacing:-.02em; color:var(--ink); font-variant-numeric:tabular-nums}
.x-sub{display:block; font-size:13px; color:var(--mid)}
.x-sub b{color:var(--swt)}
.it.x-row{gap:12px; min-height:52px}
.x-dot{flex:0 0 auto; width:8px; height:8px; border-radius:50%; background:var(--sw)}
.it em.x-when, .x-ev em.x-when{font-style:normal; color:var(--swt); font-weight:600}
.x-amt{flex:0 0 auto; font-size:15px; font-weight:700; font-variant-numeric:tabular-nums}
.x-auto{flex:0 0 auto; min-width:47px; text-align:center; font-size:12px; font-weight:600; color:#1b5a56}
/* quotes: time left to accept */
.x-tl{position:relative; height:34px; margin:30px 4px 2px}
.x-tl.tall{height:52px}
.x-tl .x-trk, .x-tl .x-fill{position:absolute; left:0; top:6px; height:4px; border-radius:2px}
.x-tl .x-trk{right:0; background:var(--line)}
.x-tl .x-fill{background:#f9cf62}
.x-tl .x-now{position:absolute; left:0; top:0; width:16px; height:16px; margin-left:-2px; border-radius:50%; background:var(--ink); border:3px solid var(--panel); box-shadow:0 0 0 1px var(--ink)}
.x-tl .x-nowl{position:absolute; left:0; top:20px; font-size:11.5px; font-weight:700; color:var(--ink)}
.x-tl .x-mk{position:absolute; top:1px; width:14px; height:14px; margin-left:-7px; border-radius:50%; background:var(--sw); border:2px solid var(--panel); box-shadow:0 0 0 1px var(--swt)}
.x-tl .x-lb, .x-tl .x-dt{position:absolute; transform:translateX(-50%); font-size:11.5px; white-space:nowrap}
.x-tl .x-lb{top:-24px; font-weight:700; color:var(--swt)}
.x-tl .x-dt{top:20px; color:var(--mid)}
.x-tl .x-dt.lo{top:36px}
.x-tl .x-dt.lo b{color:var(--swt)}
.x-tl .r{transform:translateX(calc(-100% + 9px))}
.it.x-q{gap:12px; min-height:76px; align-items:center}
.x-bar{flex:0 0 auto; width:4px; align-self:stretch; border-radius:2px; background:var(--sw)}
.it.x-q .tr{gap:5px}
/* subscriptions */
.x-lede{margin:0 10px 10px; font-size:15px; line-height:1.4; color:var(--mid)}
.x-lede b{font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums}

.x-doc{display:flex; flex-direction:column; min-width:0; border:1px solid var(--line); border-radius:calc(var(--radius) * .6); overflow:hidden; background:var(--panel)}

.x-nav{width:32px; height:32px; flex:0 0 auto; border:1px solid var(--line); border-radius:50%; background:var(--panel); color:var(--ink); display:grid; place-items:center; padding:0}

.x-day:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.x-dots{display:flex; gap:3px; height:7px}

.x-ev:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.x-ev .tm{flex:0 0 64px; font-size:13px; font-weight:600; font-variant-numeric:tabular-nums}
.x-ev .tm2{flex:0 0 74px; display:flex; flex-direction:column; line-height:1.2}
.x-ev .tm2 b{font-size:12.5px}
.x-ev .tm2 span{font-size:11.5px; color:var(--mid); font-variant-numeric:tabular-nums}
.x-ev .bar{flex:0 0 auto; width:3px; align-self:stretch; margin:4px 0; border-radius:2px; background:var(--sw)}
.x-ev .tx{flex:1 1 auto; min-width:0}
.x-ev .tx b{display:block; font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.x-ev .tx > span{display:block; font-size:12.5px; color:var(--mid); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.x-ev .st{flex:0 0 auto; font-size:12.5px; font-weight:600; color:var(--swt)}
.x-empty{margin:0; padding:18px 10px; font-size:14px; color:var(--mid)}
.x-legend{display:flex; flex-wrap:wrap; justify-content:flex-end; gap:4px 14px; padding:10px 10px 2px; font-size:12px; color:var(--mid)}

/* Entries, wide widget: the list lines up as a table (Entry, Details, Status, From, Date) under a header row */

/* month style, wide widget: the calendar keeps a comfortable width on the left and the list of what's coming up fills the right,

  .x-cal-in > .x-legend{grid-column:1; justify-content:flex-start; align-self:end; padding-bottom:6px}

/* =====================================================================
   Portal builder: editing the portal right on the page
   ===================================================================== */
.sr{position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}
.poc .slot{flex:0 0 auto; display:flex; align-items:center; justify-content:center}
.poc .den-l{font-size:12px; font-weight:600; color:var(--c-mid); margin-right:-4px}
/* Data (amount of sample data) is parked for now: delete this line to bring it back */
.poc .den-l, .poc #denSeg{display:none !important}
/* every click redraws the page, and some widgets adjust their size right after drawing; the browser's scroll anchoring
   read that brief in-between layout as content moving and scrolled to compensate, so the page jumped. The page keeps its own scroll position instead */
html, body, .stage, .frame{overflow-anchor:none}
.poc .slot .pbtn{justify-content:center}
.poc .vas{width:100%; text-align:center; font-size:12px; font-weight:600; color:var(--c-mid); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.poc .seg button:focus-visible{outline:2px solid var(--c-acc); outline-offset:-2px}
/* the settings pane now holds Appearance only; it sits under the prototype bar so the bar's buttons stay reachable */
.drawer{top:var(--poc-h, 49px)}
.drawer .dr-b{flex:1 1 auto}
.dr-ft .pbtn.go{margin-left:auto}
body.is-dragging, body.is-dragging *{cursor:grabbing !important; user-select:none !important; -webkit-user-select:none !important}
body.is-resizing, body.is-resizing *{cursor:ew-resize !important; user-select:none !important; -webkit-user-select:none !important}

.portal{--ed:#2d6ae3; --ed-soft:#e9f0fd; --ed-line:#9db9f0}

/* a fixed three-column grid: each widget spans 1, 2 or 3 columns, and the grid packs them in order with no holes.
   Narrower containers fold to two columns, then one; a three-column widget becomes two wide in the two-column layout */
.portal .main .grid{grid-template-columns:minmax(0,1fr); grid-auto-flow:row dense; grid-auto-rows:1fr; gap:30px 32px}
/* columns: one below 760px, two from 760px, three from 1200px, so a widget is never much narrower than about 340px */
@container portal (min-width:760px){ .portal .main .grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@container portal (min-width:1200px){ .portal .main .grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
.portal .main .grid > .w{grid-column:span var(--sw, 1)}
@container portal (min-width:760px){ .portal .main .grid > .w[data-sw="2"], .portal .main .grid > .w[data-sw="3"]{--sw:2} }
@container portal (min-width:1200px){ .portal .main .grid > .w[data-sw="3"]{--sw:3} }

/* a widget that takes more than one column keeps its body filling the card */
.portal .main .grid > .w > .w-body{flex:1 1 auto; overflow-x:hidden}
/* widget heading: icon, title and chevron share one centerline. The title's box is trimmed to its cap height, so it centers on the letters whatever the font's metrics */
.portal .w-h h2 button{display:inline-flex; align-items:center; gap:6px; max-width:100%}
.portal .w-h h2 .ttl-t{display:block; min-width:0; line-height:1; padding:.25em 0; text-box:trim-both cap alphabetic}
.portal .w-h h2 .ttl-ch{flex:0 0 auto}
.x-doc, .x-doc .btn{min-width:0}
.x-doc .acts{flex-wrap:wrap}

/* Forms widget: every form the guest can open, scrolling inside the card when the list is long */
.fw.fw-s{max-height:calc(var(--slot) * 5 + 8px); overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; padding:2px 2px}
/* a long list fills whatever height its row gives the widget, and scrolls only past that */
.fw-wrap{position:relative; flex:1 1 auto; min-height:0}
.fw-wrap.long{min-height:calc(var(--slot) * 5 + 8px)}
.fw-wrap.long > .fw-s{position:absolute; inset:0; max-height:none}
.fw.fw-s{overflow-x:hidden}
.fw-wrap:not(.long) > .fw-s{max-height:none; overflow-y:visible}
.fw.fw-s:focus-visible{outline:2px solid var(--accent); outline-offset:-2px; border-radius:calc(var(--radius) * .6)}

/* the edit bar above the grid */
.edbar{display:flex; align-items:center; flex-wrap:wrap; gap:10px 18px; margin:0 0 26px; padding:12px 16px; border:1px solid var(--ed-line); border-radius:var(--radius); background:var(--ed-soft); color:#1c2b3f}
.edbar-t{flex:1 1 320px; min-width:0; font-size:13.5px; line-height:1.45; color:#3a4a5f}
.edbar-t b{display:block; font-size:15px; color:#12233a; margin-bottom:1px}
.edbar-a{display:flex; flex-wrap:wrap; gap:8px}
.edb{display:inline-flex; align-items:center; gap:7px; min-height:36px; padding:7px 14px; border:1px solid var(--ed); border-radius:999px; background:#fff; color:var(--ed); font-size:13.5px; font-weight:700; cursor:pointer}
.edb:hover{background:#f4f8ff}
.edb.solid{background:var(--ed); color:#fff}
.edb.solid:hover{background:#2459c4}
.edb.quiet{border-color:#c4d2ea; color:#3a4a5f; font-weight:600}
.edb:focus-visible{outline:3px solid color-mix(in srgb, var(--ed) 40%, transparent); outline-offset:2px}
.edb .icon{width:15px; height:15px}

/* a widget in edit mode: a dashed frame, a grip, its title as a field, a remove button, and a handle on its right edge */
.w.ed::before{content:""; position:absolute; inset:-10px; border:1.5px dashed var(--ed-line); border-radius:calc(var(--radius) + 6px); pointer-events:none; transition:border-color .15s, background-color .15s; z-index:0}
.w.ed:hover::before, .w.ed:focus-within::before{border-style:solid; border-color:var(--ed)}
.w.ed > *:not(.w-rs){position:relative; z-index:1}
.w.ed .w-h{gap:4px; align-items:center}
.w-grip{flex:0 0 auto; width:28px; height:34px; margin-left:-8px; display:grid; place-items:center; border:0; background:none; padding:0; border-radius:6px; color:var(--dim); cursor:grab; touch-action:none}
.w-grip:hover{background:var(--ed-soft); color:var(--ed)}
.w-grip:focus-visible{outline:2px solid var(--ed); outline-offset:0}
.w-grip svg{width:10px; height:16px}
.ttl-ed{position:relative; display:flex; align-items:center; flex:1 1 auto; min-width:0; overflow:visible !important; text-overflow:clip !important}
/* the title field is as wide as its text (an invisible copy of the text sizes it), so the pencil sits right after the words */
.w.ed .ttl-ed{display:inline-grid; flex:0 1 auto; margin-right:auto; max-width:100%}
.w.ed .ttl-ed::after{content:attr(data-v) " "; grid-area:1 / 1; visibility:hidden; white-space:pre; overflow:hidden; padding:2px 28px 2px 7px; border:1px solid transparent; font:inherit; letter-spacing:inherit}
.w.ed .ttl-ed > .w-ttl{grid-area:1 / 1; width:100%}
/* the field is pulled 7px left (its negative margin), so the pencil sits 7px further in to stay inside the field's border */
.w.ed .ttl-ed .pen{right:13px}

/* ---------- widget sizes: a widget spans 1 to 3 columns and 1 to 3 rows; once resized it stays in the column it was resized in ---------- */
@container portal (min-width:760px){
  .portal .main .grid > .w[data-h="2"]{grid-row:span 2}
  .portal .main .grid > .w[data-h="3"]{grid-row:span 3}
}
@container portal (min-width:1200px){
  .portal .main .grid > .w[data-c="1"]{grid-column:1 / span var(--sw, 1)}
  .portal .main .grid > .w[data-c="2"]{grid-column:2 / span var(--sw, 1)}
  .portal .main .grid > .w[data-c="3"]{grid-column:3 / span var(--sw, 1)}
}
/* the Add Widget tile fills one grid cell, like the builder's empty field slot */
.w-addtile{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:var(--spacing-3); min-height:160px; padding:var(--spacing-4); border:1px dashed var(--border-input); border-radius:0; background:var(--bg-primary); color:var(--text-add-item); font:var(--font-bold) var(--text-3)/1.3 var(--font-body); cursor:pointer; transition:background-color var(--duration-hovered), border-color var(--duration-hovered)}
.w-addtile:hover{background:linear-gradient(var(--bg-hovered), var(--bg-hovered)), var(--bg-primary); border-color:var(--border-selected-nav-intense)}
.w-addtile:focus-visible{outline:1px solid var(--outline-focused); outline-offset:1px}
.w-addtile .icon{width:var(--spacing-icon-xl); height:var(--spacing-icon-xl); color:var(--icon-intense)}
.w-addtile[hidden], .w-addbar[hidden]{display:none !important}
/* resize: the bottom-right corner grip, plus the right and bottom edges of the edit frame */
.w-rz{display:none; padding:0; border:0; background:none; touch-action:none}
.w.ed > .w-rz{position:absolute; z-index:4}
@container portal (min-width:640px){ .w.ed > .w-rz{display:block} }
.w.ed > .w-rz.e{top:0; bottom:20px; right:-15px; width:10px; cursor:ew-resize}
.w.ed > .w-rz.s{left:0; right:20px; bottom:-15px; height:10px; cursor:ns-resize}
.w.ed.no-w > .w-rz.e{display:none}
.w.ed > .w-rz.se{right:-19px; bottom:-19px; width:22px; height:22px; color:var(--icon-subtle); cursor:nwse-resize; transition:color var(--duration-hovered)}
.w.ed.no-w > .w-rz.se{cursor:ns-resize}
.w-rz.se::before{content:""; position:absolute; inset:5px; background:linear-gradient(135deg, transparent 0 46%, currentColor 46% 54%, transparent 54% 66%, currentColor 66% 74%, transparent 74% 86%, currentColor 86% 94%, transparent 94%)}
.w-rz.se:hover, .w.resizing > .w-rz.se{color:var(--border-selected-nav-intense)}
.w-rz.se:focus-visible{outline:1px solid var(--outline-focused); outline-offset:0}
.w.ed:has(> .w-rz.e:hover)::before{border-right:2px solid var(--border-selected-nav-intense)}
.w.ed:has(> .w-rz.s:hover)::before{border-bottom:2px solid var(--border-selected-nav-intense)}
.w.ed.resizing{box-shadow:var(--shadow-popper); overflow:hidden}
.w.ed.resizing::before{display:none}
.w-ph{display:grid; place-items:center; border:1px dashed var(--border-selected-nav-intense); border-radius:0; background:var(--bg-selected-nav); box-shadow:none !important}
.w-ph-l{padding:var(--spacing-2) var(--spacing-3); border:1px solid var(--border-subtle); background:var(--bg-primary); color:var(--text-primary); font:var(--font-normal) var(--text-1)/1.3 var(--font-body)}
.w-ghost .w-rz{display:none !important}
/* Widget edit tools (settings, trash): a tab attached to the top-right corner of the edit outline, in the edit color,
   so they read as builder controls rather than part of the guest's widget. Its edges turn solid with the outline on hover/focus. */
.w.ed > .w-edt{position:absolute; top:-10px; right:-10px; z-index:6; display:flex; align-items:center; gap:2px; padding:3px;
  background:var(--ed-soft); border-left:1px dashed var(--border-input); border-bottom:1px dashed var(--border-input); color:var(--icon-subtle);
  transition:background-color var(--duration-hovered), border-color var(--duration-hovered)}
.w.ed:hover > .w-edt, .w.ed:focus-within > .w-edt, .w.ed:has(.wmenu) > .w-edt{border-left:1px solid var(--border-selected-nav-intense); border-bottom:1px solid var(--border-selected-nav-intense); color:var(--icon-subtle-hovered)}
.w-edt .w-mn, .w-edt .w-rm{width:28px; height:28px; margin:0; border-radius:0; color:inherit}

.w-edt .w-mn:focus-visible, .w-edt .w-rm:focus-visible{outline:2px solid currentColor; outline-offset:-3px}
.w-edt .menu.wmenu{color:var(--ink)}
.w.ed .w-h{padding-right:calc(16px + 64px)}
.w.ed > .w-edt.l{right:auto; left:-10px; border-left:0; border-right:1px dashed var(--border-input)}
.w.ed:hover > .w-edt.l, .w.ed:focus-within > .w-edt.l, .w.ed:has(.wmenu) > .w-edt.l{border-left:0; border-right:1px solid var(--border-selected-nav-intense)}

.w-edt .w-grip:hover{background:color-mix(in srgb, currentColor 18%, transparent); color:inherit}
.w-edt .w-grip:focus-visible{outline:2px solid currentColor; outline-offset:-3px}
.w.ed .w-h{padding-top:calc(14px + 18px)}
.w-ghost .w-edt{display:none !important}

body.is-resizing.rz-se, body.is-resizing.rz-se *{cursor:nwse-resize !important}
body.is-resizing.rz-e, body.is-resizing.rz-e *{cursor:ew-resize !important}
body.is-resizing.rz-s, body.is-resizing.rz-s *{cursor:ns-resize !important}

/* footer links: one box to paste an address into, its icon worked out from the address, and the links below as a list */
.pf-h{margin-bottom:var(--spacing-4)}
.pf-row{display:flex; align-items:center; flex-wrap:wrap; gap:var(--spacing-3); max-width:640px}

.pf-e{display:block; margin-top:var(--spacing-2)}

/* the footer while editing: the real footer, always shown. Its icons take a remove button on hover or focus,
   and its corner holds Add Social Links (no links yet) or a + after the last icon, which opens the link popover */

.pf-plus, .pf-new{border:1.5px dashed color-mix(in srgb, var(--head-ink) 55%, transparent); background:transparent; color:var(--head-ink); cursor:pointer; transition:background-color .15s}

const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
const lin = c => c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4);
const lum = h => { const [r, g, b] = rgb(h).map(lin); return .2126 * r + .7152 * g + .0722 * b; };
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
const inkOn = h => contrast(h, "#ffffff") >= 3.2 ? "#ffffff" : "#1b242d";
function mixHex(h, t, f){ const a = rgb(h), b = rgb(t); return "#" + a.map((v, i) => Math.round((v + (b[i] - v) * f) * 255).toString(16).padStart(2, "0")).join(""); }
const isDark = h => inkOn(h) === "#ffffff";
function readable(h, bg = "#ffffff"){ const to = isDark(bg) ? "#ffffff" : "#000000"; let c = h, f = 0; while (contrast(c, bg) < 4.6 && f < 1){ f += .06; c = mixHex(h, to, f); } return c; }

function dashWhen(o){
  if (o.band === "overdue") return plural(-daysFrom(o.due), "day") + " late";
  if (o.band === "due") return (o.status === "Unsuccessful" ? "Automatic payment failed · due " : "Due ") + fDate(o.due);
  return fDate(o.due) + " · " + o.card;
}
function payGroups(shown, items){
  let i = 0;
  return ["overdue", "due", "scheduled"].map(b => {
    const g = shown.filter(o => o.band === b); if (!g.length) return "";
    const first = i; i += g.length;
    return '<div class="w-grp' + (first >= 3 ? " g4" : "") + '"><i class="sw-' + PAY[b][1] + '"></i>' + PAY[b][0] + "<em>" + items.filter(o => o.band === b).length + "</em></div>"
      + g.map(o => '<button class="it" data-open="payments:' + o.id + '">' + W.payments.row(o) + "</button>").join("");
  }).join("");
}
function payWhen(o){
  if (o.band === "overdue") return "Was due " + fDate(o.due) + " · " + plural(-daysFrom(o.due), "day") + " late";
  if (o.band === "due") return (o.status === "Unsuccessful" ? "Automatic payment failed · due " : "Due ") + fDay(o.due);
  if (o.band === "scheduled") return fDate(o.due) + " · charges " + o.card + " automatically";
  return (o.band === "refunded" ? "Refunded " : "Paid ") + fDate(o.paid);
}
function subLine(u){
  if (u.state === "Paused") return "Paused · resumes " + u.resume;
  return "Renews " + fDate(u.next) + " · " + (u.auto ? "automatic, " + u.card : "you pay each renewal");
}
function evActs(e, sm){
  const s = sm ? " sm" : "", a = [];
  if (e.task){ const t = data("tasks").find(x => x.id === e.id); a.push('<span class="btn solid' + s + '" data-act="task" data-id="' + e.id + '">' + esc(t ? t.verb : "Open Task") + "</span>"); }
  else if (e.pay) a.push('<span class="btn solid' + s + '" data-open="payments:' + e.inv + '">View Invoice</span>');
  else {
    if (e.status === "RSVP") a.push('<span class="btn solid' + s + '" data-act="rsvp" data-id="' + e.id + '">RSVP</span>');
    if (e.status === "To Confirm") a.push('<span class="btn solid' + s + '" data-act="confirm" data-id="' + e.id + '">Confirm</span>');
    a.push('<span class="btn' + s + '" data-act="cal">' + ic("date") + "Add to Calendar</span>");
  }
  return a.join("");
}

function logoHtml(){
  const t = S.theme;
  return '<span class="mk"><img src="' + (t.upload || COGNITO_ICON) + '" alt=""></span>';
  if (t.logo === "sail") return '<span class="mk">' + SAIL(ink === "#ffffff" ? "#ffffff" : acc, ink === "#ffffff" ? T.headerBg : "#ffffff") + "</span>";
  if (t.logo === "cup") return '<span class="mk">' + CUP(acc, "#ffffff") + "</span>";
  if (t.logo === "leaf") return '<span class="mk">' + LEAF(acc, "#ffffff") + "</span>";
  if (t.logo === "mono") return '<span class="mk">' + MONO(acc, "#ffffff", ORG.name.split(" ").map(w => w[0]).slice(0, 2).join("")) + "</span>";
  return "";
}
function greet(){ const h = NOW.getHours(); return (h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening") + ", " + ME.first; }

/* a widget moved to the header: Messages becomes a bell with the newest conversations; Subscriptions and Payment Methods join the avatar menu */
const HEADABLE = ["notifications", "subscriptions", "cards"];
const inHead = k => !!(S.inHead[k] && S.on[k]);
function bellCtl(){
  const th = threads(), f = th.reduce((a, t) => a + t.fresh, 0), open = S.menu === "bell";
  const row = t => '<button class="bm-r" data-open="notifications:' + t.id + '"><span class="unr' + (t.fresh ? " on" : "") + '"></span>' + avatar(t.last)
    + '<span class="tx"><b>' + esc(t.ann ? t.last.subj : t.entry) + "</b><span>" + (t.ann ? "Announcement · " + esc(t.aud) : esc(t.last.from) + ": " + esc(preview(t.last))) + "</span></span><em>" + ago(t.at) + "</em></button>";
  return '<div class="me"><button class="bell" data-act="bell" aria-label="' + esc(W.notifications.title) + (f ? ", " + f + " new" : "") + '" aria-expanded="' + open + '">' + ic("bell") + (f ? '<span class="bdg">' + f + "</span>" : "") + "</button>"
    + (open ? '<div class="menu bmenu"><div class="bm-h"><b>' + esc(W.notifications.title) + "</b>" + (f ? "<span>" + f + " new</span>" : "") + "</div>"
      + (th.length ? th.slice(0, 5).map(row).join("") : '<p class="bm-none">Notifications from ' + esc(ORG.name) + " will show up here.</p>")
      + '<div class="bm-ft"><button data-go="notifications">View All ' + esc(W.notifications.title) + "</button>" + (editing() ? '<button data-act="topage" data-k="notifications">Move Back to Page</button>' : "") + "</div></div>" : "") + "</div>";
}
function acctItems(){
  /* while editing, each item moved here has its own Move Back to Page button beside it */
  const ed = editing(), row = (k, b) => ed ? '<div class="mrow">' + b + '<button class="mvb" data-act="topage" data-k="' + k + '" aria-label="Move ' + esc(W[k].title) + ' back to the page">Move Back to Page</button></div>' : b;
  let h = "";
  if (inHead("subscriptions")){ const live = data("subscriptions").filter(u => u.state === "Active").length; h += row("subscriptions", '<button data-go="subscriptions">' + ic("sync") + esc(W.subscriptions.title) + (live && !ed ? "<em>" + live + " active</em>" : "") + "</button>"); }
  if (inHead("cards")){
    const cs = data("cards"), ex = cs.filter(c => cardState(c) === "expired").length, so = cs.filter(c => cardState(c) === "soon").length;
    h += row("cards", '<button data-go="cards">' + ic("credit-card") + esc(W.cards.title) + (ed ? "" : ex ? '<em class="warn">' + ex + " expired</em>" : so ? '<em class="warn">' + so + " expiring</em>" : cs.length ? "<em>" + plural(cs.length, "card") + "</em>" : "") + "</button>");
  }
  return h;
}
/* header images: a few generic photos, or one the respondent uploads */
const HEADER_IMGS = [["fjord", "Fjord", 1015], ["mountains", "Mountains", 1036], ["forest", "Forest", 1043], ["city", "City", 1067], ["workspace", "Workspace", 180], ["coffee", "Coffee", 431]];
/* library photos load from picsum.photos (Unsplash photos), so they only download when someone picks Library Image;
   the claude.ai preview blocks outside images, so they show only where this file is hosted */
const pic = (id, w, h) => "https://picsum.photos/id/" + id + "/" + w + "/" + h;
function headerImg(){
  const h = S.theme.headerImg; if (!h) return "";
  if (h.kind === "upload") return S.theme.headerUp || "";
  const p = HEADER_IMGS.find(x => x[0] === h.id); return p ? pic(p[2], 2000, 700) : "";
}
/* large uploads are scaled down before they're kept, so they fit in the browser's storage with the rest of the setup */
function shrinkImage(file, max, done){
  const r = new FileReader();
  r.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); done(c.toDataURL("image/jpeg", .82)); }; im.src = r.result; };
  r.readAsDataURL(file);
}
function headerHtml(){
  return '<header class="ph"><button class="logo" data-act="home">' + logoHtml() + "<b>" + esc(ORG.name) + '</b></button><span class="sp"></span><div class="hd-r">' + (inHead("notifications") ? bellCtl() : "")
    + '<div class="me"><button class="av" data-act="acct" aria-label="Account" aria-expanded="' + (S.menu === "acct") + '">' + ME.initials + "</button>"
    + (S.menu === "acct" ? '<div class="menu amenu"><div class="mh"><b>' + ME.name + "</b><span>" + ME.email + '</span></div><div class="mcap">People on This Account</div>' + ME.people.map(p => '<div class="ppl-m"><b>' + esc(p[0]) + "</b> · " + esc(p[1]) + "</div>").join("") + '<button data-act="profile">' + ic("guest-person") + "Profile</button>" + acctItems() + '<div class="msep"></div><button data-act="toast" data-msg="Logs you out of the portal.">' + ic("logout") + "Log Out</button></div>" : "")
    + "</div></div></header>";

function capSegs(root){
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for (let n; (n = tw.nextNode());){
    if (n.nodeValue.indexOf("·") < 0 || n.parentNode.nodeName === "TEXTAREA") continue;

  }
}

    if (RTE_DROP[tag]){ c.remove(); return; }
    cleanNode(c);
    if (!RTE_OK[tag]){ c.replaceWith(...c.childNodes); return; }
    const keep = {};
    if (tag === "A"){ const h = c.getAttribute("href") || ""; if (/^(https?:|mailto:|tel:)/i.test(h.trim())) keep.href = h.trim(); keep.target = "_blank"; keep.rel = "noopener"; }
    if (tag === "IMG"){ const s = c.getAttribute("src") || ""; if (!/^(https?:|data:image\/(png|jpe?g|gif|webp);)/i.test(s.trim())){ c.remove(); return; } keep.src = s.trim(); keep.alt = c.getAttribute("alt") || ""; }

    Array.from(c.attributes).forEach(a => c.removeAttribute(a.name));
    Object.keys(keep).forEach(k => c.setAttribute(k, keep[k]));

}

function moveWidget(k, to){

$("#drawer").addEventListener("pointerdown", e => {
  const g = e.target.closest(".grip"); if (!g || e.button !== 0) return;
  e.preventDefault();
  const row = g.closest(".wi"), list = row.parentNode, y0 = e.clientY;
  /* listen on the document: moving the row in the DOM drops pointer capture, so the grip alone would miss the release */
  row.classList.add("drag");
  let base = 0;
  const move = ev => {
    row.style.transform = "translateY(" + (ev.clientY - y0 - base) + "px)";
    const r = row.getBoundingClientRect(), mid = r.top + r.height / 2;
    const others = Array.from(list.children).filter(x => x !== row);
    const before = others.find(x => { const b = x.getBoundingClientRect(); return mid < b.top + b.height / 2; });
    const prevTop = row.getBoundingClientRect().top;
    if (before ? row.nextElementSibling !== before : list.lastElementChild !== row){

      base += row.getBoundingClientRect().top - prevTop;
      row.style.transform = "translateY(" + (ev.clientY - y0 - base) + "px)";
    }
  };
  const up = () => {
    document.removeEventListener("pointermove", move); document.removeEventListener("pointerup", up); document.removeEventListener("pointercancel", up);
    const to = Array.from(list.children).indexOf(row);
    row.classList.remove("drag"); row.style.transform = "";

/* ---------- modes ---------- */
const editing = () => S.mode === "edit" && S.view === "home" && S.host === "hosted";
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const announce = m => { const el = $("#sr"); if (el){ el.textContent = ""; setTimeout(() => { el.textContent = m; }, 30); } };
let saveT = null;
const queueSave = () => { clearTimeout(saveT); saveT = setTimeout(saveSettings, 400); };
function setMode(m){
  if (S.mode === m) return;
  S.mode = m; S.menu = null; S.pfPop = false; closeAdd(true);
  render(); renderDrawer();
  announce(m === "view" ? "Preview. This is what your end-users see." : "Editing the portal.");
}
function renderPoc(){
  const v = S.mode === "view", b = $("#brandBtn");
  b.innerHTML = ic("edit") + "Customize Appearance";
  /* Customize Appearance and Reset Layout show in Edit and Preview alike */
  b.hidden = false; b.setAttribute("aria-expanded", String(!!S.drawer));
  $("#resetBtn").hidden = false;
  document.querySelectorAll("#modeSeg button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.mode === S.mode)));
  /* Desktop / Tablet / Phone is parked for now: set this back to !v to bring it back in Preview */
  { $("#devSeg").hidden = true; }
  document.querySelectorAll("#devSeg button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.dev === S.device)));
  const den = S.data === "small" || S.data === "medium" ? S.data : "full";
  document.querySelectorAll("#denSeg button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.den === den)));
  document.documentElement.style.setProperty("--poc-h", $(".poc").offsetHeight + "px");
}
$("#denSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S.data = b.dataset.den; S.menu = null; S.evSel = null; render(); renderPoc(); announce({ small:"Small", medium:"Medium", full:"Large" }[S.data] + " amount of sample data."); });
$("#devSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (b){ S.device = b.dataset.dev; render(); } });
$("#brandBtn").addEventListener("click", () => { S.drawer = !S.drawer; renderDrawer(); renderPoc(); });
$("#resetBtn").addEventListener("click", () => resetLayout());
window.addEventListener("resize", () => renderPoc());

/* ---------- the pieces the portal draws in edit mode ---------- */
function editBar(){
  return '<div class="edbar" role="region" aria-label="Edit layout"><div class="edbar-t"><b>You’re editing your portal</b>Drag a widget by its grip to reorder, drag its right edge to resize, and click a title to rename it.</div>'
    + '<div class="edbar-a">' + (canAdd() ? '<button class="edb solid" data-ed="add">' + ic("plus") + "Add Widget</button>" : "") + '<button class="edb" data-ed="preview">' + ic("preview") + 'View as End-User</button><button class="edb quiet" data-ed="reset">Reset Layout</button></div></div>';
}
/* Notifications, Subscriptions, and Payment Methods can leave the page for the header: a ⋯ beside the trash can moves them,
   and the avatar menu (or the bell) moves them back while editing */
/* Payment Methods and Subscriptions have one control instead of ⋯ and trash: an arrow up to the top-right corner that moves them to the account menu */
const TO_MENU = ["cards", "subscriptions"];
const TO_MENU_IC = '<svg class="icon" aria-hidden="true" viewBox="0 0 17 17" fill="none"><path d="M7.5 3.5H3.5C2.94772 3.5 2.5 3.94772 2.5 4.5V13.5C2.5 14.0523 2.94772 14.5 3.5 14.5H12.5C13.0523 14.5 13.5 14.0523 13.5 13.5V9.5M10.5 2.5H14.5V6.5M14.5 2.5L10.5 6.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="8.2" r="1.7" stroke="currentColor"/><path d="M4.2 12.6C4.6 11.4 5.7 10.6 7 10.6C8.3 10.6 9.4 11.4 9.8 12.6" stroke="currentColor" stroke-linecap="round"/></svg>';

const TO_HEAD = { notifications:["bell", "Show as Bell Icon in the Top Bar"], subscriptions:["guest-person", "Move to Account Menu"], cards:["guest-person", "Move to Account Menu"] };
function wMore(k, title){
  if (!HEADABLE.includes(k) && k !== "submissions") return "";
  const open = S.menu === "w:" + k;
  return '<div class="w-more"><button class="w-mn" data-act="wmenu" data-k="' + k + '" aria-label="Settings for ' + esc(title) + '" aria-haspopup="true" aria-expanded="' + open + '" title="Settings">' + ic("settings") + "</button>"

      /* Entries: show recent entries, or group them by form */

function moveHead(k, on){
  S.inHead[k] = on; S.menu = null; render();
  const t = W[k].title;
  toast(on ? (k === "notifications" ? t + " is now a bell icon in the top bar. Open it to move it back." : t + " moved to the account menu. Open it from your initials to move it back.") : t + " is back on the page.");

function widgetHead(k, title, icon){
  if (!editing()) return null;
  const vis = visibleKeys(), i = vis.indexOf(k), n = vis.length, lbl = sizeLabel(Math.min(MAX_COLS, S.sz[k] || 1), S.ht[k] || 1);

  return '<div class="w-edt l"><button class="w-grip" data-ed-grip="' + k + '" aria-label="Reorder ' + esc(title) + ', position ' + (i + 1) + " of " + n + '. Drag, or use the arrow keys." title="Drag to reorder">' + GRIP + '</button></div><header class="w-h">'
    + '<h2 class="ttl-ed" data-v="' + esc(title) + '"><input class="w-ttl" data-ed-name="' + k + '" value="' + esc(title) + '" size="1" maxlength="40" aria-label="Widget title" spellcheck="false" autocomplete="off"><span class="pen" aria-hidden="true">' + ic("edit") + "</span></h2>"
    + (TO_MENU.includes(k)
      /* edit tools: a tab fastened to the top-right corner of the edit outline, kept out of the widget's own header */
      ? '</header><div class="w-edt" role="group" aria-label="Edit ' + esc(title) + '">' + wMore(k, title) + "</div>"
      : '</header><div class="w-edt" role="group" aria-label="Edit ' + esc(title) + '">' + wMore(k, title) + '<button class="w-rm" data-ed-rm="' + k + '" aria-label="Remove ' + esc(title) + ' from the portal" title="Remove widget">' + ic("trash") + "</button></div>")
    + '<span class="w-rz e" data-ed-rz="' + k + '" data-dir="e" aria-hidden="true"></span><span class="w-rz s" data-ed-rz="' + k + '" data-dir="s" aria-hidden="true"></span>'
    + '<button class="w-rz se" data-ed-rz="' + k + '" data-dir="se" aria-label="Resize ' + esc(title) + ', ' + lbl + '. Drag, or use the arrow keys." title="Drag to resize"></button>';
}
const visibleKeys = () => dashKeys().filter(k => k !== "billing");
/* Forms and Forms & Entries are folded into Entries (Group by Form). Their code stays so they can come back: take them out of RETIRED */
const RETIRED = ["forms", "formsx"];
const entMode = () => S.entMode === "form" ? "form" : "all";
/* Entries: show every entry, or group them by form; a small dropdown at the right end of the All / My Submissions row */
const entSel = () => '<label class="ent-sel"><span class="sr">Show entries</span><select data-entmode>'
  + [["all", "Show recent"], ["form", "Group by form"]].map(o => '<option value="' + o[0] + '"' + (entMode() === o[0] ? " selected" : "") + ">" + o[1] + "</option>").join("") + "</select>" + ic("chevron-down") + "</label>";
/* inside a widget being edited, nothing is clickable: the page is for arranging, Preview is for using it */
function decorate(root){
  if (!editing()) return;
  root.querySelectorAll(".w.ed .w-body, .w.ed .w-scope:not(.ent-row), .w.ed .w-sub, .w.ed .ent-row > .scope").forEach(el => el.setAttribute("inert", ""));
}

/* ---------- footer ---------- */
/* "" when empty, null when it isn't a web address, else the address with its scheme (http and https only) */
function socialUrl(v){
  v = (v || "").trim(); if (!v) return "";
  if (!/^[a-z][a-z0-9+.-]*:/i.test(v)) v = "https://" + v;
  try { const u = new URL(v); return (u.protocol === "https:" || u.protocol === "http:") && /\.[a-z]{2,}$/i.test(u.hostname) ? u.href : null; } catch (e) { return null; }
}
const footerLinks = () => S.links.map(u => { const p = platformOf(u); return [p.id, p.name, u]; });
/* the footer as end-users see it. While editing it is always shown: each icon gets a remove button on hover or focus,

    return ed ? '<span class="pf-lk">' + a + '<button class="pf-x" data-pf-rm="' + i + '" aria-label="Remove ' + esc(l[1]) + ' link" title="Remove ' + esc(l[1]) + '">' + ic("ex") + "</button></span>" : a;
  }).join("");
  const tg = ' data-pf-toggle aria-haspopup="dialog" aria-expanded="' + open + '" aria-controls="pfPop"';

function deviceType(){

function surveyUrl(x){

/* a respondent who changed nothing first confirms the portal is right as it is */

const closeDone = () => { const el = $("#sdone"); if (el) el.remove(); $("#doneBtn").focus(); };

/* ---------- saving: the layout, names, footer links, and appearance are kept in this browser ---------- */
